<title>Pista do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cena clara em tela cheia, painel flutuante no canto, bússola; paleta de escritório colorido com laranja de destaque */
:root{
  --panel:#fffaf3; --ink:#2a1d14; --muted:#7a6656; --line:#eadccb; --accent:#e0560b; --accent-ink:#ffffff; --sky:#f4ead9;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#1d1712; --ink:#f3e9df; --muted:#b5a594; --line:#3a2f26; --accent:#ff8a3d; --accent-ink:#1d1006; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#1d1712; --ink:#f3e9df; --muted:#b5a594; --line:#3a2f26; --accent:#ff8a3d; --accent-ink:#1d1006; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  width:min(290px, calc(100% - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;box-shadow:0 10px 30px rgba(60,30,10,.22);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-right:64px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:2px 0 0;color:var(--accent)}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--ink);font-size:16px;font-family:var(--display)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 12.5px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.toggle{position:absolute;top:12px;right:12px;padding:3px 9px;font-size:11px}
.panel.min .stats,.panel.min .btns,.panel.min .hint{display:none}
.compass{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(60,30,10,.22);display:grid;place-items:center}
.compass svg{width:52px;height:52px}
</style>

<div id="scene"></div>
<aside class="panel" id="panel">
  <button class="toggle" id="tgl" aria-expanded="true">Ocultar</button>
  <div><div class="eyebrow">Circuito indoor · TI &amp; café</div><h1>Pista do Escritório</h1></div>
  <div class="stats"><div>Extensão<b id="sLen">–</b></div><div>Loop<b id="sLoop">–</b></div><div>Velocidade<b id="sSpd">–</b></div></div>
  <div class="btns">
    <button id="bCar" aria-pressed="true">Carro</button>
    <button id="bChase" aria-pressed="false">Câmera do carro</button>
    <button id="bLoop">Ver o loop</button>
    <button id="bJump">Ver o salto</button>
    <button id="bRamps">Ver as rampas</button>
    <button id="bRot" aria-pressed="false">Girar</button>
    <button id="bTop">Vista de cima</button>
    <button id="bReset">Recentrar</button>
  </div>
  <div class="hint" id="status">Passando o café…</div>
  <div class="hint">Arraste para girar, role ou pince para aproximar, botão direito ou dois dedos para mover.</div>
</aside>
<div class="compass" aria-label="Norte"><svg id="comp" viewBox="-30 -30 60 60"><polygon points="0,-24 6,0 -6,0" fill="#e0560b"/><polygon points="0,24 6,0 -6,0" fill="#9c8f84"/><text x="0" y="-12" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700" dy="3">N</text></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
// traçado em planta (m): reta de largada embaixo com o loop, subida pela direita, reta suspensa com o salto em cima, descida e rampas pela esquerda
const POLY=[[-340,-200],[260,-200],[340,-120],[340,60],[200,180],[-20,180],[-120,80],[-260,180],[-360,100],[-360,-110]];
const ROAD=14,KERB=1.2,WALL_H=1.3,WALL_W=0.8,H=ROAD/2,LANE=ROAD/4,CAR_OFF=-LANE/2;
const LITE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700;

const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,LITE?1:1.5));renderer.setSize(host.clientWidth,host.clientHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.92;
host.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();const st=document.getElementById('status');st.hidden=false;st.textContent='O navegador interrompeu o 3D por falta de memória de vídeo. Recarregue a página.';});
const scene=new THREE.Scene();const HAZE=0xf4ead9;scene.fog=new THREE.Fog(HAZE,700,2000);
const camera=new THREE.PerspectiveCamera(42,host.clientWidth/host.clientHeight,0.3,6000);
const HOME={pos:new THREE.Vector3(-470,300,470),tgt:new THREE.Vector3(-10,0,-10)};camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.copy(HOME.tgt);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.48;controls.minDistance=5;controls.maxDistance=1500;controls.autoRotateSpeed=.5;

scene.add(new THREE.HemisphereLight(0xfff8f0,0xb9a8e0,0.7));
const sun=new THREE.DirectionalLight(0xfff1dc,1.2);sun.position.set(-260,520,300);sun.castShadow=true;const SM=LITE?2048:3072;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-700,right:700,top:540,bottom:-540,near:50,far:1900});sun.shadow.bias=-0.0004;scene.add(sun);
// céu de escritório: luz quente no horizonte e azul claro em cima
(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 d;void main(){float y=d.y;vec3 c=mix(vec3(.96,.92,.85),vec3(.74,.84,.98),smoothstep(0.,.55,y));c=mix(c,vec3(.93,.86,.78),smoothstep(0.,-.2,y));
  gl_FragColor=linearToOutputTexel(vec4(pow(c,vec3(2.2)),1.));}`});
 const s=new THREE.Mesh(new THREE.SphereGeometry(4000,32,16),m);s.renderOrder=-1;s.onBeforeRender=()=>s.position.copy(camera.position);scene.add(s);})();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};
const status=document.getElementById('status');
const tex=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;};
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];};
const MONO='600 30px ui-monospace, Menlo, Consolas, "Courier New", monospace';

// ---- linha central em planta: retas e esquinas arredondadas ----
const pts=[];{const R=40,n=POLY.length,V=a=>new THREE.Vector2(a[0],a[1]);
  for(let i=0;i<n;i++){const a=V(POLY[(i-1+n)%n]),b=V(POLY[i]),c=V(POLY[(i+1)%n]);const d1=b.clone().sub(a).normalize(),d2=c.clone().sub(b).normalize();
    const e1=b.clone().addScaledVector(d1,-R),e2=b.clone().addScaledVector(d2,R);
    for(let k=0;k<=8;k++){const t=k/8;const q=e1.clone().multiplyScalar((1-t)**2).addScaledVector(b,2*(1-t)*t).addScaledVector(e2,t*t);pts.push(new THREE.Vector3(q.x,0,q.y));}
    const e=c.clone().addScaledVector(d2,-R),L=e.distanceTo(e2),m=Math.floor(L/30);for(let k=1;k<m;k++){const q=e2.clone().lerp(e,k/m);pts.push(new THREE.Vector3(q.x,0,q.y));}}}
const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal');
const M=Math.round(curve.getLength()/1.25);const CP=curve.getSpacedPoints(M).slice(0,M);
const tn2=CP.map((p,i)=>{const a=CP[(i-1+M)%M],b=CP[(i+1)%M];return new THREE.Vector2(b.x-a.x,b.z-a.z).normalize();});
const nearM=(x,z)=>{let b=1e9,bi=0;CP.forEach((p,i)=>{const d=(p.x-x)**2+(p.z-z)**2;if(d<b){b=d;bi=i;}});return bi;};
const dM=(a,b)=>((b-a)%M+M)%M;
const within=(m,a,b)=>dM(a,m)<=dM(a,b);
const fr=(m,a,b)=>dM(a,m)/Math.max(1,dM(a,b));

// ---- relevo: subida suspensa sobre lápis, reta alta com o salto, descida e ondulações ----
const HT=17,GAP=20,LIP=16,LIPH=2.6;
const mU0=nearM(340,-100),mU1=nearM(340,10),mD0=nearM(-40,160),mD1=nearM(-112,88);
const mG=nearM(90,180),g0m=(mG-GAP/2+M)%M,mB0=nearM(-140,94),mB1=nearM(-240,166);
/* morros extras: depois do loop, no alto da direita e na curva da esquerda */
const HILLS=[[nearM(150,-200),nearM(250,-196),8],[nearM(340,28),nearM(262,160),8],[nearM(-292,150),nearM(-360,80),11]];
function elev(m){let y=0;
  if(within(m,mU0,mU1))y=HT*ss(0,1,fr(m,mU0,mU1));
  else if(within(m,mU1,mD0))y=HT;
  else if(within(m,mD0,mD1))y=HT*(1-ss(0,1,fr(m,mD0,mD1)));
  const a=(g0m-LIP+M)%M,g1=(g0m+GAP)%M;
  if(within(m,a,g0m)){const u=fr(m,a,g0m);y+=LIPH*u*u;}             /* rampa de decolagem antes do vão */
  else if(within(m,g0m,g1)){y+=LIPH*(1-fr(m,g0m,g1));}
  if(within(m,mB0,mB1)){const u=fr(m,mB0,mB1);y+=5*Math.pow(Math.sin(u*Math.PI*2),2);}
  for(const [ha,hb,hh] of HILLS)if(within(m,ha,hb)){const u=fr(m,ha,hb);y+=hh*Math.pow(Math.sin(u*Math.PI),2);}
  return y+0.3;}

// ---- loop vertical na reta de largada: a pista desvia de lado para a saída não bater na entrada ----
const mL=nearM(60,-200),LR=15,NL=Math.round(2*Math.PI*LR/1.25),DJ=9.5,JL=44;
const Y=new THREE.Vector3(0,1,0);
const latOf=m=>{const t=tn2[m];return new THREE.Vector3(-t.y,0,t.x);},fwdOf=m=>{const t=tn2[m];return new THREE.Vector3(t.x,0,t.y);};
const jog=m=>{const d=((m-mL+M+M/2)%M)-M/2;if(d<0&&d>=-JL)return -DJ*ss(0,1,(d+JL)/JL);if(d>0&&d<=JL)return DJ*(1-ss(0,1,d/JL));return 0;};
const bL=latOf(mL),dL=fwdOf(mL),baseL=CP[mL].clone().setY(elev(mL));
const P=[],PM=[],LTH=[],KofM=new Int32Array(M);
for(let m=0;m<M;m++){KofM[m]=P.length;
  if(m===mL){for(let j=0;j<=NL;j++){const th=2*Math.PI*j/NL;
      P.push(baseL.clone().addScaledVector(dL,LR*Math.sin(th)).addScaledVector(Y,LR*(1-Math.cos(th))).addScaledVector(bL,-DJ+2*DJ*j/NL));PM.push(m);LTH.push(th);}continue;}
  const p=CP[m].clone().addScaledVector(latOf(m),jog(m));p.y=elev(m);P.push(p);PM.push(m);LTH.push(-1);}
const N=P.length;const isLoop=k=>LTH[k]>=0;
// referenciais da pista em cada ponto: frente, lado e "cima" (dentro do loop o "cima" aponta para o centro)
const T=[],B=[],U=[];
for(let k=0;k<N;k++){const t=P[(k+1)%N].clone().sub(P[(k-1+N)%N]).normalize();
  let b=isLoop(k)?bL.clone():new THREE.Vector3(-t.z,0,t.x);if(b.lengthSq()<1e-6)b=bL.clone();b.normalize();
  const u=new THREE.Vector3().crossVectors(b,t).normalize();b.crossVectors(t,u).normalize();T.push(t);B.push(b);U.push(u);}
function xs(k,off,y,out){return (out||new THREE.Vector3()).copy(P[k]).addScaledVector(B[k],off).addScaledVector(U[k],y);}
const cum=new Float32Array(N+1);for(let k=1;k<=N;k++)cum[k]=cum[k-1]+P[k%N].distanceTo(P[k-1]);const trackLen=cum[N];
const idist=(a,b)=>Math.min((a-b+N)%N,(b-a+N)%N);
const GK0=KofM[g0m],gapQ=k=>!isLoop(k)&&((k-GK0+N)%N)<GAP;
const LOOPK=KofM[mL];
const si=KofM[nearM(-230,-200)];
// rampas de salto no chão: subida, voo e rampa de pouso
const KICK={RL:10,RH:2.3,J:24,Hh:6};
const kicks=[KofM[nearM(-360,58)],KofM[nearM(-170,-200)]];
const APEX=5.5;
function hopY(ff){let y=0;for(const k0 of kicks){const r=((ff-k0)%N+N)%N,SP=2*KICK.RL+KICK.J;if(r>=SP)continue;
    if(r<KICK.RL)y=KICK.RH*r/KICK.RL;else if(r<KICK.RL+KICK.J){const u=(r-KICK.RL)/KICK.J;y=KICK.RH+4*KICK.Hh*u*(1-u);}else y=KICK.RH*(1-(r-KICK.RL-KICK.J)/KICK.RL);}
  const rg=((ff-GK0)%N+N)%N;if(rg<GAP){const u=rg/GAP;y+=4*APEX*u*(1-u);}
  return y;}
// grade para achar o ponto da pista mais próximo (em planta)
const G=20,grid=new Map();CP.forEach((p,i)=>{const k=Math.floor(p.x/G)+','+Math.floor(p.z/G);(grid.get(k)||grid.set(k,[]).get(k)).push(i);});
function nearest(x,z){const gx=Math.floor(x/G),gz=Math.floor(z/G);let best=1e9,bi=-1;
  for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){const l=grid.get((gx+a)+','+(gz+b));if(!l)continue;for(const i of l){const d=(CP[i].x-x)**2+(CP[i].z-z)**2;if(d<best){best=d;bi=i;}}}
  return bi<0?null:{d:Math.sqrt(best),m:bi};}
const clear=(x,z,r)=>{const n=nearest(x,z);if(n&&n.d<H+KERB+WALL_W+DJ*(Math.abs(jog(n.m))>0.5?1:0)+3+r)return false;
  if(Math.hypot(x-baseL.x,z-baseL.z)<LR+DJ+H+10+r)return false;return true;};

const mixers=[];
function build(){
  // ---- piso de carpete colorido ----
  {const [c,x]=canvas(512,512);const cols=['#ff8fb0','#6fcfff','#ffd84d','#a98bff','#7fdc8f','#ffa463','#4fd1c0','#ff8ad8'];
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=cols[(i*3+j*5)%cols.length];x.fillRect(i*128,j*128,128,128);
      x.globalAlpha=.08;for(let k=0;k<500;k++){x.fillStyle=k%2?'#000':'#fff';x.fillRect(i*128+Math.random()*128,j*128+Math.random()*128,2,2);}x.globalAlpha=1;
      x.strokeStyle='rgba(120,90,70,.18)';x.lineWidth=3;x.strokeRect(i*128+1.5,j*128+1.5,125,125);}
    const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2600/80,2200/80);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(2600,2200).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({map:t,roughness:.95}));fl.receiveShadow=true;scene.add(fl);}

  // ---- pista: asfalto escuro com linhas neon, zebras de café com leite, muretas de teclas coloridas ----
  function strip(offA,offB,yA,yB,vScale,material,keepGap=false){const pos=[],uv=[],idx=[];const va=new THREE.Vector3(),vb=new THREE.Vector3();
    for(let i=0;i<=N;i++){const k=i%N;xs(k,offA,yA,va);xs(k,offB,yB,vb);pos.push(va.x,va.y,va.z,vb.x,vb.y,vb.z);uv.push(0,cum[i]/vScale,1,cum[i]/vScale);
      if(i<N&&(keepGap||!gapQ(k))){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);return m;}
  const [ac,a]=canvas(256,512);
  {const gr=a.createLinearGradient(0,0,256,0);gr.addColorStop(0,'#2a2240');gr.addColorStop(.5,'#22243a');gr.addColorStop(1,'#1d2a3c');a.fillStyle=gr;a.fillRect(0,0,256,512);}
  for(let i=0;i<9000;i++){const g=40+Math.random()*26|0;a.fillStyle=`rgba(${g},${g+4},${g+20},.8)`;a.fillRect(Math.random()*256,Math.random()*512,1.5,1.5);}
  const lines=g=>{g.fillStyle='#ff3fa4';g.fillRect(4,0,8,512);g.fillStyle='#2ef2ff';g.fillRect(244,0,8,512);
    for(const [px,c] of [[61,'#b35cff'],[124,'#ffe14d'],[187,'#b35cff']]){g.fillStyle=c;g.fillRect(px,40,8,190);g.fillRect(px,296,8,190);}};
  lines(a);const [ec,eg]=canvas(256,512);eg.fillStyle='#000';eg.fillRect(0,0,256,512);lines(eg);
  const at=tex(ac),atEm=tex(ec);[at,atEm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
  const [kc,kx]=canvas(16,64);kx.fillStyle='#6b3a1f';kx.fillRect(0,0,16,32);kx.fillStyle='#f4e2c4';kx.fillRect(0,32,16,32);
  const kt=tex(kc);kt.wrapS=kt.wrapT=THREE.RepeatWrapping;
  // mureta: fileira de teclas coloridas (cada tecla com um símbolo)
  const [wc,wx]=canvas(128,512);{const cols=['#ff5a5f','#ffb400','#00c2a8','#3d7cff','#a05cff','#ff7ac8','#7bd84a','#ff8a3d'];const sym=['{','}','<','>','/','$','#','@','&',';','=','*'];
    for(let k=0;k<8;k++){const y=k*64;wx.fillStyle='#2b2733';wx.fillRect(0,y,128,64);const c=cols[k];wx.fillStyle=c;wx.beginPath();if(wx.roundRect)wx.roundRect(8,y+5,112,54,10);else wx.rect(8,y+5,112,54);wx.fill();
      wx.fillStyle='rgba(255,255,255,.28)';wx.fillRect(14,y+9,100,10);wx.save();wx.translate(64,y+34);wx.rotate(-Math.PI/2);wx.fillStyle='#fff';wx.font='800 34px ui-monospace, Menlo, monospace';wx.textAlign='center';wx.textBaseline='middle';wx.fillText(sym[(k*5)%sym.length],0,0);wx.restore();}}
  const wt=tex(wc);wt.wrapS=wt.wrapT=THREE.RepeatWrapping;
  const W0=H+KERB,W1=H+KERB+WALL_W;
  const deckM=mat(0x4b4560,{roughness:.6,metalness:.3,side:THREE.DoubleSide});
  strip(-W1,W1,-1.0,-1.0,10,deckM);strip(-W1,-W1,-1.0,0,10,deckM);strip(W1,W1,0,-1.0,10,deckM);
  strip(-W0,-H,0.06,0.1,3,new THREE.MeshStandardMaterial({map:kt,emissiveMap:kt,emissive:0xffffff,emissiveIntensity:.15,roughness:.5,side:THREE.DoubleSide}));
  strip(H,W0,0.1,0.06,3,new THREE.MeshStandardMaterial({map:kt,emissiveMap:kt,emissive:0xffffff,emissiveIntensity:.15,roughness:.5,side:THREE.DoubleSide}));
  strip(-H,H,0.1,0.1,ROAD,new THREE.MeshStandardMaterial({map:at,emissiveMap:atEm,emissive:0xffffff,emissiveIntensity:1.2,roughness:.4,metalness:.3,side:THREE.DoubleSide}));

    if(car.visible&&!reduce){const i=Math.floor(carT*N)%N,j=(i+12)%N;let turn=0;if(!isLoop(i)&&!isLoop(j))turn=Math.abs(T[i].x*T[j].z-T[i].z*T[j].x);const slope=isLoop(i)?0:T[i].y;
      let target=Math.max(16,48-turn*170-slope*35);
      if(near(i,LOOPK,130,NL+10))target=Math.max(target,48);
      if(near(i,GK0,90,GAP+6))target=Math.max(target,48);
      for(const k0 of kicks)if(near(i,k0,60,2*KICK.RL+KICK.J))target=Math.max(target,42);
      speed+=(target-speed)*Math.min(1,dt*(speed>target+8?0.6:1.5));
      for(const pd of pads){if(idist(i,pd.i)<3&&Math.abs(pd.lane-CAR_OFF)<0.1&&pd.hit!==Math.floor(now/2000)){pd.hit=Math.floor(now/2000);speed=Math.max(speed,72);boostFx();}}
      carT=(carT+speed*dt/trackLen)%1;}
    const f=carT*N;xsF(f,CAR_OFF,0.1,cP);xsF(f+2.6,CAR_OFF,0.1,cQ);xsF(f,CAR_OFF,1.1,cU);cU.sub(cP).normalize();
    const h0=hopY(f),h1=hopY(f+2.6);cP.addScaledVector(cU,h0);cQ.addScaledVector(cU,h1);
    car.position.copy(cP);car.up.copy(cU);car.lookAt(cQ);if(!reduce)updateSparks(dt);wheels.forEach(w=>w.rotation.x+=speed*dt/0.42);
    $('sSpd').textContent=Math.round(speed*3.6)+' km/h';
    if(chase){camLock=true;const fc=f-10;xsF(fc,CAR_OFF,5.5,cC);xsF(fc,CAR_OFF,1.1,cN);xsF(fc,CAR_OFF,0.1,cM);cN.sub(cM).normalize();cC.addScaledVector(cN,Math.max(hopY(fc),h0*0.9));
      camera.position.lerp(cC,.2);camera.up.lerp(cN,.15).normalize();controls.target.copy(cQ).addScaledVector(cU,1.2);camera.lookAt(controls.target);}
    else if(camLock){camLock=false;camera.up.set(0,1,0);}
  };
}
let onFrame=null,camLock=false,anim=null,canBeacons=[];function fly(pos,tgt){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.getElementById('tgl').onclick=e=>{const m=document.getElementById('panel').classList.toggle('min');e.currentTarget.textContent=m?'Mostrar':'Ocultar';e.currentTarget.setAttribute('aria-expanded',!m);};
if(window.innerWidth<520){document.getElementById('panel').classList.add('min');document.getElementById('tgl').textContent='Mostrar';}
window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);});
const comp=document.getElementById('comp');
function loop(now){requestAnimationFrame(loop);
  if(anim){let k=Math.min(1,(now-anim.s)/1400);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(k>=1)anim=null;}
  if(onFrame)onFrame(now);if(!camLock)controls.update();comp.style.transform=`rotate(${controls.getAzimuthalAngle()*180/Math.PI}deg)`;renderer.render(scene,camera);}
setTimeout(()=>{try{build();}catch(e){status.textContent='Não foi possível montar a cena.';console.error(e);}},30);
requestAnimationFrame(loop);
})();
