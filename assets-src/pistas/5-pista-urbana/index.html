<title>Pista Urbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cena noturna em tela cheia, painel flutuante no canto, bússola; paleta de asfalto com neon magenta e ciano */
:root{
  --panel:#f5f3f8; --ink:#1c1726; --muted:#655c74; --line:#dcd6e4; --accent:#c4267f; --accent-ink:#ffffff; --sky:#0d1020;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#17141f; --ink:#ece7f4; --muted:#a79fb6; --line:#332c40; --accent:#ff5cb8; --accent-ink:#1a0d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#17141f; --ink:#ece7f4; --muted:#a79fb6; --line:#332c40; --accent:#ff5cb8; --accent-ink:#1a0d16; color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  width:min(280px, calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-right:64px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:2px 0 0;color:var(--accent)}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--ink);font-size:16px;font-family:var(--display)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 12.5px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.toggle{position:absolute;top:12px;right:12px;padding:3px 9px;font-size:11px}
.panel.min .stats,.panel.min .btns,.panel.min .hint{display:none}
.compass{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35);display:grid;place-items:center}
.compass svg{width:52px;height:52px}
</style>

<div id="scene"></div>
<aside class="panel" id="panel">
  <button class="toggle" id="tgl" aria-expanded="true">Ocultar</button>
  <div><div class="eyebrow">Circuito de rua · noite</div><h1>Pista Urbana</h1></div>
  <div class="stats"><div>Extensão<b id="sLen">–</b></div><div>Ponte<b id="sBr">fechada</b></div><div>Velocidade<b id="sSpd">–</b></div></div>
  <div class="btns">
    <button id="bCar" aria-pressed="true">Carro</button>
    <button id="bChase" aria-pressed="false">Câmera do carro</button>
    <button id="b360">Ver 360°</button>
    <button id="bTube">Ver o tubo</button>
    <button id="bBridge">Ver a ponte</button>
    <button id="bSky">Canhões de luz</button>
    <button id="bRot" aria-pressed="false">Girar</button>
    <button id="bTop">Vista de cima</button>
    <button id="bReset">Recentrar</button>
  </div>
  <div class="hint" id="status">Acendendo a cidade…</div>
  <div class="hint">Arraste para girar, role ou pince para aproximar, botão direito ou dois dedos para mover.</div>
</aside>
<div class="compass" aria-label="Norte"><svg id="comp" viewBox="-30 -30 60 60"><polygon points="0,-24 6,0 -6,0" fill="#b5432f"/><polygon points="0,24 6,0 -6,0" fill="#8a8f86"/><text x="0" y="-12" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700" dy="3">N</text></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function(){
const MW=1100,MH=800;
// circuito de rua: quarteirões em ângulo reto, esquinas arredondadas (metros)
const POLY=[[-380,-220],[-90,-220],[-90,-110],[130,-110],[130,-230],[390,-230],[390,-30],[250,-30],[250,130],[390,130],[390,250],[50,250],[50,100],[-130,100],[-130,250],[-390,250]];
const ROAD=17,KERB=1.1,WALL_H=1.1,WALL_W=0.6,H=ROAD/2,LANE=ROAD/4,CAR_OFF=-LANE/2,DIR=1;
const LITE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700;

const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,LITE?1:1.5));renderer.setSize(host.clientWidth,host.clientHeight);

const scene=new THREE.Scene();const HAZE=0x1a1b33;scene.fog=new THREE.Fog(HAZE,260,1400);

const HOME={pos:new THREE.Vector3(-520,360,560),tgt:new THREE.Vector3(0,0,0)};camera.position.copy(HOME.pos);

scene.add(new THREE.HemisphereLight(0x8090c8,0x1a1622,0.55));
const moon=new THREE.DirectionalLight(0xb8c4ff,0.55);moon.position.set(-300,420,200);moon.castShadow=true;const SM=LITE?2048:3072;moon.shadow.mapSize.set(SM,SM);
Object.assign(moon.shadow.camera,{left:-600,right:600,top:450,bottom:-450,near:50,far:1600});moon.shadow.bias=-0.0004;scene.add(moon);
// céu noturno: azul profundo, brilho da cidade no horizonte e estrelas
(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,

 fragmentShader:`varying vec3 d;float h(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
  void main(){float y=d.y;vec3 c=mix(vec3(.32,.18,.36),vec3(.1,.11,.24),smoothstep(-.02,.22,y));c=mix(c,vec3(.02,.03,.08),smoothstep(.2,.9,y));

 const s=new THREE.Mesh(new THREE.SphereGeometry(4000,32,16),m);s.renderOrder=-1;s.onBeforeRender=()=>s.position.copy(camera.position);scene.add(s);})();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};
const status=document.getElementById('status');

// linha central: retas e esquinas arredondadas
const pts=[];{const R=40,n=POLY.length,V=a=>new THREE.Vector2(a[0],a[1]);
  for(let i=0;i<n;i++){const a=V(POLY[(i-1+n)%n]),b=V(POLY[i]),c=V(POLY[(i+1)%n]);const d1=b.clone().sub(a).normalize(),d2=c.clone().sub(b).normalize();
    const e1=b.clone().addScaledVector(d1,-R),e2=b.clone().addScaledVector(d2,R);
    for(let k=0;k<=8;k++){const t=k/8;const q=e1.clone().multiplyScalar((1-t)**2).addScaledVector(b,2*(1-t)*t).addScaledVector(e2,t*t);pts.push(new THREE.Vector3(q.x,0,q.y));}
    const e=c.clone().addScaledVector(d2,-R),L=e.distanceTo(e2),m=Math.floor(L/30);for(let k=1;k<m;k++){const q=e2.clone().lerp(e,k/m);pts.push(new THREE.Vector3(q.x,0,q.y));}}}
const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal');const trackLen=curve.getLength();
const N=Math.round(trackLen/1.25);const C=curve.getSpacedPoints(N).slice(0,N);
const tan=C.map((p,i)=>{const a=C[(i-1+N)%N],b=C[(i+1)%N];return new THREE.Vector2(b.x-a.x,b.z-a.z).normalize();});
const idist=(a,b)=>Math.min((a-b+N)%N,(b-a+N)%N);
let si=0;{let b=1e9;C.forEach((p,i)=>{const d=Math.hypot(p.x-250,p.z-250);if(d<b){b=d;si=i;}});} // largada na reta de cima

// ---- tubo suspenso com saca-rolhas: no trecho mais reto da pista ----
const cv=C.map((p,i)=>{const a=tan[(i-6+N)%N],b=tan[(i+6)%N];return Math.abs(a.x*b.y-a.y*b.x);});
let tA=-1;const tLen=230,RAMP=80;
{let best=1e9;for(let s=0;s<N;s+=4){const mid=(s+tLen/2)%N;if(idist(mid,si)<tLen/2+RAMP+60)continue;let m=0;for(let j=0;j<tLen;j++)m=Math.max(m,cv[(s+j)%N]);if(m<best){best=m;tA=s;}}}
const inTunnel=(i,m=0)=>tA>=0&&((i-tA+m+N)%N)<tLen+2*m;
const TR=14,TAX=9.4,WMAX=10.25,R0=0.22,R1=0.82,ELEV=6.5;
const phi=new Float32Array(N);{const rs=Math.round(tLen*R0),re=Math.round(tLen*R1);for(let k=rs;k<=re;k++){const u=(k-rs)/(re-rs);phi[(tA+k)%N]=2*Math.PI*(u-0.75*Math.sin(2*Math.PI*u)/(2*Math.PI));}}
// altura da pista: no nível da rua, subindo em viaduto até o tubo
// relevo da pista: além do viaduto do tubo, elevados que sobem e descem e uma lombada
const dTun=i=>{const r=((i-tA)%N+N)%N;return r<tLen?0:Math.min(r-tLen,N-r);};
let bi0=0;{let b=1e9;C.forEach((p,i)=>{const d=Math.hypot(p.x+235,p.z+220);if(d<b){b=d;bi0=i;}});}
const HILLS=[];
{const specs=[{h:13,w:120},{h:9,w:100},{h:16,w:130},{h:4,w:26}];
  for(const sp of specs){let best=-1,bs=-1;for(let c=0;c<N;c+=5){const m=Math.min(dTun(c)-RAMP-sp.w-15,idist(c,bi0)-sp.w-90,idist(c,si)-sp.w-30,...HILLS.map(H2=>idist(c,H2.c)-H2.w-sp.w-30));
      if(m<0)continue;const sc=m>200?200:m;if(sc>bs){bs=sc;best=c;}}if(best>=0)HILLS.push({c:best,...sp});}}
const el=C.map((p,i)=>{let y=0.35+ELEV*(1-ss(10,RAMP,dTun(i)));for(const h of HILLS)y+=h.h*(1-ss(h.w*0.55,h.w,idist(i,h.c)));return y;});
function xs(k,off,y,out){const p=C[k],t=tan[k],nx=-t.y,nz=t.x;
  if(inTunnel(k,1)){off=Math.max(-WMAX,Math.min(WMAX,off));y=Math.max(y,0);}
  const ph=phi[k];if(ph){const c=Math.cos(ph),s=Math.sin(ph),v=y-TAX;const L=off*c-v*s;y=off*s+v*c+TAX;off=L;}
  return (out||new THREE.Vector3()).set(p.x+nx*off,el[k]+y,p.z+nz*off);}
// ---- ponte levadiça sobre um canal que cruza a reta de baixo ----
let bi=0;{let b=1e9;C.forEach((p,i)=>{const d=Math.hypot(p.x+235,p.z+220);if(d<b){b=d;bi=i;}});}
const HS=20,BT=tan[bi],BC=C[bi].clone();
const inLoopPt=(x,z)=>{let c=false;for(let i=0,j=N-1;i<N;j=i++){const a=C[i],b=C[j];if(((a.z>z)!==(b.z>z))&&(x<(b.x-a.x)*(z-a.z)/(b.z-a.z)+a.x))c=!c;}return c;};
let inX=-BT.y,inZ=BT.x;if(!inLoopPt(BC.x+inX*30,BC.z+inZ*30)){inX=-inX;inZ=-inZ;}
const CW=23,RB=55,SA=-250,SB=150,WL=-2.5; // meia-largura do canal, raio das bacias, centros das bacias (eixo do canal), nível da água
const fromCanal=(s,l)=>[BC.x+inX*s+BT.x*l,BC.z+inZ*s+BT.y*l];
function canalDist(x,z){const dx=x-BC.x,dz=z-BC.z,s=dx*inX+dz*inZ,l=dx*BT.x+dz*BT.y;let d=1e9;if(s>=SA&&s<=SB)d=Math.abs(l)-CW;return Math.min(d,Math.hypot(s-SA,l)-RB,Math.hypot(s-SB,l)-RB);}
const canalOutline=(()=>{const o=[],a=Math.sqrt(RB*RB-CW*CW);
  for(let s=SA+a;s<SB-a;s+=8)o.push([s,-CW]);
  {const a0=Math.atan2(-CW,-a),a1=Math.atan2(CW,-a)+2*Math.PI*0;for(let k=0;k<=48;k++){const th=a0+(a1-a0)*k/48;o.push([SB+RB*Math.cos(th),RB*Math.sin(th)]);}}
  for(let s=SB-a;s>SA+a;s-=8)o.push([s,CW]);
  {const a0=Math.atan2(CW,a),a1=Math.atan2(-CW,a)+2*Math.PI;for(let k=0;k<=48;k++){const th=a0+(a1-a0)*k/48;o.push([SA+RB*Math.cos(th),RB*Math.sin(th)]);}}
  return o.map(([s,l])=>fromCanal(s,l));})();
const bridgeQ=k=>((k-(bi-HS))%N+N)%N<2*HS;           // trecho da pista ocupado pela ponte
const STOP=(bi-HS-14+N)%N;
const RL=12,RH=2.6,G0=16,EXT=16,HA0=(bi-HS+N)%N,K0=(HA0-G0-RL+N)%N,JL=G0+2*HS+EXT,LA=(HA0+2*HS+EXT)%N; /* rampa de decolagem, vão, rampa de pouso */                              // linha de parada antes da ponte
const G=20,grid=new Map();C.forEach((p,i)=>{const k=Math.floor(p.x/G)+','+Math.floor(p.z/G);(grid.get(k)||grid.set(k,[]).get(k)).push(i);});
function nearest(x,z,R=3){const gx=Math.floor(x/G),gz=Math.floor(z/G);let best=1e9,bi=-1;
  for(let a=-R;a<=R;a++)for(let b=-R;b<=R;b++){const l=grid.get((gx+a)+','+(gz+b));if(!l)continue;for(const i of l){const d=(C[i].x-x)**2+(C[i].z-z)**2;if(d<best){best=d;bi=i;}}}
  return bi<0?null:{d:Math.sqrt(best),i:bi};}

// texturas de janelas (acesas ao acaso) e de neon
function windowsTex(seed,warm){const c=document.createElement('canvas');c.width=256;c.height=512;const x=c.getContext('2d');let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  /* fachada clara (tingida pela cor de cada prédio) + textura só das janelas acesas para o brilho */
  const c2=document.createElement('canvas');c2.width=256;c2.height=512;const e=c2.getContext('2d');e.fillStyle='#000';e.fillRect(0,0,256,512);
  x.fillStyle='#c4c6cf';x.fillRect(0,0,256,512);x.fillStyle='#9a9ca6';for(let row=0;row<16;row++)x.fillRect(0,row*32+28,256,4);
  for(let row=0;row<16;row++)for(let col=0;col<8;col++){const on=r()<0.42;const px=col*32+5,py=row*32+6;
    const cl=on?(r()<warm?`hsl(${38+r()*12},90%,${62+r()*14}%)`:`hsl(${190+r()*30},70%,${70+r()*10}%)`):`rgb(${16+r()*12|0},${18+r()*12|0},${28+r()*14|0})`;x.fillStyle=cl;x.fillRect(px,py,22,20);if(on){e.fillStyle=cl;e.fillRect(px,py,22,20);}}
  const mk=cv=>{const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;};const t=mk(c);t.em=mk(c2);return t;}
function neonCanvas(text,col){const c=document.createElement('canvas');c.width=512;c.height=160;const x=c.getContext('2d');x.fillStyle='rgba(10,8,18,.85)';x.fillRect(0,0,512,160);
  x.font='800 96px "Bricolage Grotesque", "Trebuchet MS", sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor=col;x.shadowBlur=30;x.fillStyle=col;x.fillText(text,256,84);x.shadowBlur=8;x.fillStyle='#fff';x.globalAlpha=.55;x.fillText(text,256,84);
  x.globalAlpha=1;x.strokeStyle=col;x.lineWidth=6;x.shadowBlur=20;x.strokeRect(10,10,492,140);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const NEON=[0xff3fa4,0x2ef2ff,0xb35cff,0xffe14d,0x4dff8a];

function build(){
  // ---- chão: ruas e calçadas ----
  const gc=document.createElement('canvas');gc.width=gc.height=512;{const x=gc.getContext('2d');x.fillStyle='#2a2c33';x.fillRect(0,0,512,512);
    for(let i=0;i<14000;i++){const g=34+Math.random()*22|0;x.fillStyle=`rgb(${g},${g+1},${g+5})`;x.fillRect(Math.random()*512,Math.random()*512,2,2);}
    x.fillStyle='#4a4b52';for(let k=0;k<512;k+=128){x.fillRect(k,0,12,512);x.fillRect(0,k,512,12);}}
  const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(MW*1.6/45,MH*1.6/45);gt.encoding=THREE.sRGBEncoding;gt.anisotropy=8;
  gt.repeat.set(1/45,1/45);
  const gs=new THREE.Shape([new THREE.Vector2(-MW*.8,-MH*.8),new THREE.Vector2(MW*.8,-MH*.8),new THREE.Vector2(MW*.8,MH*.8),new THREE.Vector2(-MW*.8,MH*.8)]);
  gs.holes.push(new THREE.Path(canalOutline.map(([x,z])=>new THREE.Vector2(x,-z))));
  const ground=new THREE.Mesh(new THREE.ShapeGeometry(gs).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({map:gt,roughness:.95}));ground.receiveShadow=true;scene.add(ground);

  // ---- faixas da pista ----
  function strip(offA,offB,yA,yB,vScale,material){const pos=[],uv=[],idx=[];let dist=0;const va=new THREE.Vector3(),vb=new THREE.Vector3();

      if(i<N&&!bridgeQ(k)){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);return m;}
  const ac=document.createElement('canvas');ac.width=256;ac.height=512;const a=ac.getContext('2d');
  {const gr=a.createLinearGradient(0,0,256,0);gr.addColorStop(0,'#1e1430');gr.addColorStop(.5,'#141a33');gr.addColorStop(1,'#0f2234');a.fillStyle=gr;a.fillRect(0,0,256,512);}
  for(let i=0;i<9000;i++){const g=30+Math.random()*26|0;a.fillStyle=`rgba(${g},${g+4},${g+22},.8)`;a.fillRect(Math.random()*256,Math.random()*512,1.5,1.5);}
  a.strokeStyle='rgba(120,90,255,.22)';a.lineWidth=1.5;for(let y=0;y<=512;y+=32){a.beginPath();a.moveTo(0,y);a.lineTo(256,y);a.stroke();}for(let x=0;x<=256;x+=32){a.beginPath();a.moveTo(x,0);a.lineTo(x,512);a.stroke();}
  const lines=(g)=>{g.fillStyle='#ff3fa4';g.fillRect(4,0,8,512);g.fillStyle='#2ef2ff';g.fillRect(244,0,8,512);
    for(const [x,c] of [[61,'#b35cff'],[124,'#ffe14d'],[187,'#b35cff']]){g.fillStyle=c;g.fillRect(x,40,8,190);g.fillRect(x,296,8,190);}};

  // antes da ponte: fileiras de dash em algumas faixas
  for(const [k,ls] of [[STOP-22,[-1.5,-0.5]],[STOP-48,[0.5,1.5]],[STOP-74,[-0.5,0.5]],[STOP-100,[-1.5,1.5]]])for(const l of ls)makePad((k+N)%N,l*LANE,LANE*0.94);

  {const NP=8;for(let k=0;k<NP;k++){let best=-1,bc=1e9;const c0=(si+Math.round((k+0.5)*N/NP))%N;for(let d=-60;d<=60;d++){const i=(c0+d+N)%N;if(inTunnel(i,RAMP)||idist(i,si)<30||idist(i,bi)<90)continue;if(cv[i]<bc){bc=cv[i];best=i;}}if(best>=0)makePad(best,CAR_OFF,LANE*1.75);}}

  // ---- rampas de salto: decolagem antes da ponte e pouso depois dela ----
  {const rTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');x.fillStyle='#14121f';x.fillRect(0,0,256,256);
      for(let k=0;k<4;k++){const y=k*64;x.save();x.shadowColor=k%2?'#ff2bd6':'#ffe02b';x.shadowBlur=18;x.strokeStyle=k%2?'#ff4fe0':'#fff04a';x.lineWidth=12;x.beginPath();x.moveTo(20,y+52);x.lineTo(128,y+12);x.lineTo(236,y+52);x.stroke();x.restore();}
      x.fillStyle='#2ef2ff';x.fillRect(0,0,10,256);x.fillRect(246,0,10,256);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;})();
    const topM=new THREE.MeshStandardMaterial({map:rTex,emissive:0xffffff,emissiveMap:rTex,emissiveIntensity:.55,roughness:.45,metalness:.5});
    const sideM=mat(0x23203a,{roughness:.5,metalness:.6,emissive:0x2a0d40});
    const edgeM=new THREE.MeshBasicMaterial({color:0x2ef2ff,toneMapped:false}),edgeM2=new THREE.MeshBasicMaterial({color:0xff2bd6,toneMapped:false});
    const W=H-0.1,v=new THREE.Vector3();
    function makeRamp(k0,up){const P=[],UV=[],I=[],S=[],SI=[];
      for(let s=0;s<=RL;s++){const k=(k0+s)%N,h=RH*(up?s/RL:1-s/RL)+0.06;
        for(const o of [-W,W]){xs(k,o,h,v);P.push(v.x,v.y,v.z);UV.push(o<0?0:1,s/RL*2);}}
      for(let s=0;s<RL;s++){const a=s*2;I.push(a,a+2,a+1,a+1,a+2,a+3);}
      const top=new THREE.BufferGeometry();top.setAttribute('position',new THREE.Float32BufferAttribute(P,3));top.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));top.setIndex(I);top.computeVertexNormals();
      /* laterais e face alta */
      const add=(a,b,c,d)=>{const n=S.length/3;S.push(...a,...b,...c,...d);SI.push(n,n+1,n+2,n,n+2,n+3);};
      for(let s=0;s<RL;s++){const ka=(k0+s)%N,kb=(k0+s+1)%N,ha=RH*(up?s/RL:1-s/RL)+0.06,hb=RH*(up?(s+1)/RL:1-(s+1)/RL)+0.06;
        for(const o of [-W,W]){const A=xs(ka,o,0).toArray(),B=xs(kb,o,0).toArray(),Bt=xs(kb,o,hb).toArray(),At=xs(ka,o,ha).toArray();o<0?add(A,At,Bt,B):add(A,B,Bt,At);}}
      const ke=up?(k0+RL)%N:k0;add(xs(ke,-W,0).toArray(),xs(ke,W,0).toArray(),xs(ke,W,RH+0.06).toArray(),xs(ke,-W,RH+0.06).toArray());
      const side=new THREE.BufferGeometry();side.setAttribute('position',new THREE.Float32BufferAttribute(S,3));side.setIndex(SI);side.computeVertexNormals();
      const mt=new THREE.Mesh(top,topM),ms=new THREE.Mesh(side,new THREE.MeshStandardMaterial({color:0x23203a,roughness:.5,metalness:.6,emissive:0x2a0d40,side:THREE.DoubleSide}));mt.receiveShadow=true;ms.castShadow=true;scene.add(mt,ms);
      /* filetes neon nas bordas e na quina alta */
      for(const o of [-W,W]){const pts=[];for(let s=0;s<=RL;s++){const k=(k0+s)%N;pts.push(xs(k,o,RH*(up?s/RL:1-s/RL)+0.12));}
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),RL*2,.09,6,false),edgeM));}
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(xs(ke,-W,RH+0.1),xs(ke,W,RH+0.1)),4,.13,6,false),edgeM2));
      const lt=new THREE.PointLight(0xff2bd6,1.4,26,2);lt.position.copy(xs(ke,0,RH+2));scene.add(lt);}
    makeRamp(K0,true);makeRamp(LA,false);}

  // ---- carro com luz neon por baixo ----
  const car=new THREE.Group();scene.add(car);
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.7,4.2),mat(0x2a2f6e,{roughness:.25,metalness:.6}));body.position.y=0.75;car.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.6,2),mat(0x0e1018,{roughness:.1,metalness:.7}));cab.position.set(0,1.35,-0.2);car.add(cab);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.12,0.6),mat(0x111111));wing.position.set(0,1.35,-2);car.add(wing);
  for(const s of [-1,1]){const hl=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.05),new THREE.MeshBasicMaterial({color:0xf4f8ff,toneMapped:false}));hl.position.set(s*.6,.8,2.11);car.add(hl);
    const tl=new THREE.Mesh(new THREE.BoxGeometry(.6,.14,.05),new THREE.MeshBasicMaterial({color:0xff2040,toneMapped:false}));tl.position.set(s*.6,.85,-2.11);car.add(tl);}
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(4,6.5).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x2ef2ff,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));glow.position.y=0.05;car.add(glow);
  const wheels=[];for(const [x,z] of [[-1,1.35],[1,1.35],[-1,-1.35],[1,-1.35]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.35,16).rotateZ(Math.PI/2),mat(0x111111));w.position.set(x,0.42,z);car.add(w);wheels.push(w);}
  car.traverse(o=>{if(o.isMesh&&o!==glow)o.castShadow=true;});
  let carT=si/N,speed=0,chase=false;

  document.getElementById('sLen').textContent=(trackLen/1000).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' km';
  status.hidden=true;

  const $=id=>document.getElementById(id);
  const free=()=>{chase=false;$('bChase').setAttribute('aria-pressed',false);controls.maxPolarAngle=1.48;};
  $('bCar').onclick=e=>{car.visible=!car.visible;e.currentTarget.setAttribute('aria-pressed',car.visible);};
  $('bChase').onclick=e=>{chase=!chase;controls.maxPolarAngle=1.48;e.currentTarget.setAttribute('aria-pressed',chase);if(!chase)fly(HOME.pos.clone(),HOME.tgt.clone());};
  $('bRot').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',controls.autoRotate);};
  $('b360').onclick=()=>{free();controls.maxPolarAngle=Math.PI-0.05;const n0=(tA+Math.round(tLen*R0)-25+N)%N,n1=(tA+Math.round(tLen*R0)+12)%N;fly(xs(n0,0,TAX+1.5),xs(n1,0,TAX));};
  $('bTube').onclick=()=>{free();const m=(tA+Math.round(tLen/2))%N,c=xs(m,0,TAX),t=tan[m];const side=new THREE.Vector3(-t.y,0,t.x);
    if(Math.hypot(c.x+side.x*60,c.z+side.z*60)>Math.hypot(c.x-side.x*60,c.z-side.z*60))side.negate();fly(c.clone().addScaledVector(side,95).add(new THREE.Vector3(0,40,0)),c.clone());};
  $('bBridge').onclick=()=>{free();const [x,z]=fromCanal(-150,30);fly(new THREE.Vector3(x,30,z),new THREE.Vector3(BC.x,4,BC.z)); /* de cima do canal, olhando para a ponte */};
  $('bSky').onclick=()=>{free();controls.maxPolarAngle=Math.PI-0.05;fly(new THREE.Vector3(60,90,620),new THREE.Vector3(0,170,0));};
  $('bTop').onclick=()=>{free();fly(new THREE.Vector3(0,1150,0.01),new THREE.Vector3(0,0,0));};
  $('bReset').onclick=()=>{free();fly(HOME.pos.clone(),HOME.tgt.clone());};
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock=new THREE.Clock();
  const cP=new THREE.Vector3(),cQ=new THREE.Vector3(),cU=new THREE.Vector3(),cC=new THREE.Vector3(),cN=new THREE.Vector3(),cM=new THREE.Vector3(),vA=new THREE.Vector3(),vB=new THREE.Vector3();
  const xsF=(ff,off,y,out)=>{const a=Math.floor(ff),i=((a%N)+N)%N,j=(i+1)%N;xs(i,off,y,vA);xs(j,off,y,vB);return out.copy(vA).lerp(vB,ff-a);};
  const HA=(bi-HS+N)%N,Dh=xs(HA,0,0).distanceTo(xs((bi+HS)%N,0,0)),LEAF=Dh/2-0.12;let hopH=12,hopArmed=false;
  function hop(ff){const r=((ff-K0)%N+N)%N,SP=RL+JL+RL;if(r>=SP)return 0;if(r<RL)return RH*r/RL;if(r>=RL+JL)return RH*(1-(r-RL-JL)/RL);
    const u=(r-RL)/JL,arc=RH+4*hopH*u*(1-u),rb=r-RL-G0;if(rb<0||rb>=2*HS)return arc;
    const x=rb/(2*HS)*Dh,th=BR.e||0,lc=LEAF*Math.cos(th);const surf=x<lc?x*Math.tan(th):(Dh-x<lc?(Dh-x)*Math.tan(th):-1e9);return Math.max(arc,surf+0.05);}
  const BRTXT={closed:'fechada',warn:'atenção',opening:'abrindo',open:'aberta',closing:'fechando'};
  function carClear(){const ci=Math.floor(carT*N)%N,z0=(STOP-110+N)%N,len=((bi+HS+6-z0)%N+N)%N;return ((ci-z0+N)%N)>=len||!car.visible;}
  function updateBridge(dt,t){BR.t+=dt;const wantYaw=BR.shipS<0?0:Math.PI;
    if(!BR.moving){const dy=wantYaw-BR.shipYaw;BR.shipYaw+=Math.sign(dy)*Math.min(Math.abs(dy),dt*0.45);}
    if(BR.state==='closed'){if(BR.t>20&&Math.abs(wantYaw-BR.shipYaw)<0.01){BR.state='warn';BR.t=0;}}
    else if(BR.state==='warn'){if(BR.t>3){BR.state='opening';BR.t=0;BR.moving=true;BR.dir=BR.shipS<0?1:-1;}}
    else if(BR.state==='opening'){BR.ang=Math.min(MAXA,BR.ang+dt*MAXA/OPEN_T);if(BR.ang>=MAXA){BR.state='open';BR.t=0;}}
    else if(BR.state==='open'){if(BR.dir*BR.shipS>50){BR.state='closing';BR.t=0;}}
    else if(BR.state==='closing'){BR.ang=Math.max(0,BR.ang-dt*MAXA/CLOSE_T);if(BR.ang<=0){BR.state='closed';BR.t=0;}}
    if(BR.moving){const target=BR.dir>0?SB:SA,rem=(target-BR.shipS)*BR.dir;const vt=Math.min(16,Math.max(1,rem*.3));BR.sv+=(vt-BR.sv)*Math.min(1,dt*.9);BR.shipS+=BR.dir*BR.sv*dt;if(rem<0.4){BR.shipS=target;BR.moving=false;BR.sv=0;}}
    const e=BR.ang/MAXA,ease=e*e*(3-2*e)*MAXA;BR.e=ease;leaves.forEach(g=>g.rotation.x=-ease);placeShip();
    const go=BR.state==='closed';sig.red.material.color.setHex(go?0x3a0808:0xff2020);sig.green.material.color.setHex(go?0x22ff66:0x07300f);
    arms.forEach(a=>{const tgt=go?1.45:0;a.rotation.z+=(tgt-a.rotation.z)*Math.min(1,dt*2);});
    warnLights.forEach(w=>w.visible=go?true:Math.sin(t*8)>0);warnLights.forEach(w=>w.material.color.setHex(go?0x7a5a20:0xffa31a));
    $('sBr').textContent=BRTXT[BR.state];}
  // ---- faíscas do dash: explosão ao passar na placa e rastro das rodas por alguns instantes ----
  const SPK=480,spP=new Float32Array(SPK*3),spC=new Float32Array(SPK*3),spV=[];for(let k=0;k<SPK;k++)spV.push({l:1,c:[1,1,1]});
  const spG=new THREE.BufferGeometry();spG.setAttribute('position',new THREE.BufferAttribute(spP,3));spG.setAttribute('color',new THREE.BufferAttribute(spC,3));
  const spTex=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');const g=x.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,32,32);return new THREE.CanvasTexture(c);})();
  const spPts=new THREE.Points(spG,new THREE.PointsMaterial({size:.55,map:spTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));spPts.frustumCulled=false;scene.add(spPts);
  const spCols=[[1,.85,.3],[1,.55,.15],[1,1,.8],[.35,1,.45],[1,.3,.2],[.4,.9,1]];let spH=0,boostT=9;
  const flash=new THREE.PointLight(0xffc860,0,45,2);scene.add(flash);
  const _fw=new THREE.Vector3(),_up=new THREE.Vector3(),_sd=new THREE.Vector3();
  function carAxes(){_fw.set(0,0,1).applyQuaternion(car.quaternion);_up.set(0,1,0).applyQuaternion(car.quaternion);_sd.set(1,0,0).applyQuaternion(car.quaternion);}
  function spark(p,v){const s=spV[spH];spH=(spH+1)%SPK;s.l=0;s.x=p.x;s.y=p.y;s.z=p.z;s.vx=v.x;s.vy=v.y;s.vz=v.z;s.d=.45+Math.random()*.7;s.c=spCols[(Math.random()*spCols.length)|0];}
  function boostFx(){boostT=0;carAxes();const o=car.position.clone().addScaledVector(_up,.3);
    for(let k=0;k<110;k++){const a=Math.random()*Math.PI*2,r=4+Math.random()*11;spark(o,_sd.clone().multiplyScalar(Math.cos(a)*r).addScaledVector(_up,3+Math.random()*10).addScaledVector(_fw,-3+Math.random()*12));}
    flash.position.copy(car.position).addScaledVector(_up,1.5);flash.intensity=7;}
  function updateSparks(dt){carAxes();
    if(boostT<0.9){boostT+=dt;for(const sg of [-1,1]){const w=car.position.clone().addScaledVector(_fw,-1.6).addScaledVector(_sd,sg*.95).addScaledVector(_up,.2);
      for(let k=0;k<5;k++)spark(w,_fw.clone().multiplyScalar(-(6+Math.random()*10)).addScaledVector(_sd,(Math.random()-.5)*6).addScaledVector(_up,1+Math.random()*4));}}
    for(let k=0;k<SPK;k++){const s=spV[k];if(s.l<1){s.l+=dt/s.d;s.vy-=9.8*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;const f=Math.max(0,1-s.l);spP[k*3]=s.x;spP[k*3+1]=s.y;spP[k*3+2]=s.z;spC[k*3]=s.c[0]*f;spC[k*3+1]=s.c[1]*f;spC[k*3+2]=s.c[2]*f;}
      else{spP[k*3+1]=-9999;}}
    spG.attributes.position.needsUpdate=true;spG.attributes.color.needsUpdate=true;flash.intensity*=Math.max(0,1-dt*6);}
  onFrame=(now)=>{const dt=Math.min(.05,clock.getDelta());const t=now*0.001;if(!reduce){mixers.forEach(m=>m.update(dt));updateBridge(dt,t);wu.uT.value=t;pulseU.uT.value=t;beams.forEach(b=>{b.head.rotation.set(0,0,0);b.head.rotateY(t*b.sp+b.ph);b.head.rotateX(b.tilt+0.12*Math.sin(t*.7+b.ph));});}
    if(!reduce){pads.forEach(p=>p.chev.material.opacity=0.75+0.25*Math.sin(t*9));blink.forEach(b=>b.visible=Math.sin(t*3)>0);tubeLights.forEach((l,k)=>l.intensity=1.1+0.35*Math.sin(t*2+k*1.7));glow.material.opacity=.28+.08*Math.sin(t*5);}
    if(car.visible&&!reduce){const i=Math.floor(carT*N)%N,j=(i+12)%N;const turn=Math.abs(tan[i].x*tan[j].y-tan[i].y*tan[j].x);const slope=(el[(i+4)%N]-el[i])/4;
      let target=Math.max(14,48-turn*170-slope*40);if(phi[i])target=Math.max(target,36);
      // perto da ponte o carro acelera para saltar por cima dela quando estiver aberta
      if(((K0-i)%N+N)%N<140||((i-K0)%N+N)%N<2*RL+JL)target=Math.max(target,52);
      speed+=(target-speed)*Math.min(1,dt*(speed>target+8?0.6:1.5));
      for(const pd of pads){if(idist(i,pd.i)<3&&Math.abs(pd.lane-CAR_OFF)<0.1&&pd.hit!==Math.floor(now/2000)){pd.hit=Math.floor(now/2000);speed=Math.max(speed,72);boostFx();}}
      carT=(carT+speed*dt/trackLen)%1;}
    const f=carT*N;xsF(f,CAR_OFF,0.1,cP);xsF(f+2.6,CAR_OFF,0.1,cQ);xsF(f,CAR_OFF,1.1,cU);cU.sub(cP).normalize();
    {const r=((Math.floor(f)-K0)%N+N)%N;if(r>N-8&&!hopArmed){hopArmed=true;const near=Math.abs(BR.shipS)<70;
        hopH=BR.state==='closed'?12:Math.max((LEAF*Math.sin(MAXA)+4)/0.82,near?24:0,14);}   // altura do salto definida na chegada
      if(r>2*RL+JL+4&&r<N-8)hopArmed=false;}
    cP.y+=hop(f);cQ.y+=hop(f+2.6);
    car.position.copy(cP);car.up.copy(cU);car.lookAt(cQ);if(!reduce)updateSparks(dt);wheels.forEach(w=>w.rotation.x+=speed*dt/0.42);
    $('sSpd').textContent=Math.round(speed*3.6)+' km/h';
    if(chase){camLock=true;const fc=f-10;xsF(fc,CAR_OFF,5.5,cC);cC.y+=Math.max(hop(fc),hop(f)*0.95); /* no salto a câmera sobe junto e passa por cima da folha */xsF(fc,CAR_OFF,1.1,cN);xsF(fc,CAR_OFF,0.1,cM);cN.sub(cM).normalize();
      camera.position.lerp(cC,.2);camera.up.lerp(cN,.15).normalize();controls.target.copy(cQ).addScaledVector(cU,1.2);camera.lookAt(controls.target);}
    else if(camLock){camLock=false;camera.up.set(0,1,0);}
  };
}
let onFrame=null,camLock=false,anim=null;function fly(pos,tgt){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.getElementById('tgl').onclick=e=>{const m=document.getElementById('panel').classList.toggle('min');e.currentTarget.textContent=m?'Mostrar':'Ocultar';e.currentTarget.setAttribute('aria-expanded',!m);};
if(window.innerWidth<520){document.getElementById('panel').classList.add('min');document.getElementById('tgl').textContent='Mostrar';}
window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);});
const comp=document.getElementById('comp');
function loop(now){requestAnimationFrame(loop);
  if(anim){let k=Math.min(1,(now-anim.s)/1400);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(k>=1)anim=null;}
  if(onFrame)onFrame(now);if(!camLock)controls.update();comp.style.transform=`rotate(${controls.getAzimuthalAngle()*180/Math.PI}deg)`;renderer.render(scene,camera);}
setTimeout(()=>{try{build();}catch(e){status.textContent='Não foi possível montar a cena.';console.error(e);}},30);
requestAnimationFrame(loop);
})();
