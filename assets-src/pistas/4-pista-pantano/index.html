<title>Pista do Pântano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cena 3D em tela cheia, painel flutuante no canto, bússola; paleta de musgo e água turva */
:root{
  --panel:#f4f6ee; --ink:#1f2a1a; --muted:#5f6d55; --line:#d3dccb; --accent:#3f6b2a; --accent-ink:#ffffff; --sky:#c7d0c0;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#1a2116; --ink:#e6eedd; --muted:#a6b49a; --line:#34412c; --accent:#8fc46a; --accent-ink:#13190f; --sky:#1d241a; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#1a2116; --ink:#e6eedd; --muted:#a6b49a; --line:#34412c; --accent:#8fc46a; --accent-ink:#13190f; --sky:#1d241a; color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  width:min(280px, calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;box-shadow:0 10px 30px rgba(20,35,15,.22);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-right:64px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:2px 0 0;color:var(--accent)}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--ink);font-size:16px;font-family:var(--display)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 12.5px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.toggle{position:absolute;top:12px;right:12px;padding:3px 9px;font-size:11px}
.panel.min .stats,.panel.min .btns,.panel.min .hint{display:none}
.compass{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(20,35,15,.22);display:grid;place-items:center}
.compass svg{width:52px;height:52px}
</style>

<div id="scene"></div>
<aside class="panel" id="panel">
  <button class="toggle" id="tgl" aria-expanded="true">Ocultar</button>
  <div><div class="eyebrow">Circuito no pântano</div><h1>Pista do Pântano</h1></div>
  <div class="stats"><div>Extensão<b id="sLen">–</b></div><div>Quedas<b>2</b></div><div>Velocidade<b id="sSpd">–</b></div></div>
  <div class="btns">
    <button id="bCar" aria-pressed="true">Carro</button>
    <button id="bChase" aria-pressed="false">Câmera do carro</button>
    <button id="bJ1">Ver 1ª queda</button>
    <button id="bJ2">Ver 2ª queda</button>
    <button id="bRot" aria-pressed="false">Girar</button>
    <button id="bTop">Vista de cima</button>
    <button id="bReset">Recentrar</button>
  </div>
  <div class="hint" id="status">Alagando o terreno…</div>
  <div class="hint">Arraste para girar, role ou pince para aproximar, botão direito ou dois dedos para mover.</div>
</aside>
<div class="compass" aria-label="Norte"><svg id="comp" viewBox="-30 -30 60 60"><polygon points="0,-24 6,0 -6,0" fill="#b5432f"/><polygon points="0,24 6,0 -6,0" fill="#8a8f86"/><text x="0" y="-12" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700" dy="3">N</text></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
// mapa de 1000 × 800 m; 1 unidade = 1 m
const MW=1000,MH=800;
// traçado da pista (pontos de controle, em metros)
const CTRL=[[-360,40],[-340,-120],[-250,-235],[-110,-255],[-30,-170],[30,-60],[120,-95],[220,-210],[335,-150],[360,0],[275,125],[155,140],[95,235],[-30,265],[-145,205],[-180,95],[-265,175],[-355,150]];
const ROAD=17,KERB=1.1,WALL_H=1.1,WALL_W=0.6,H=ROAD/2,LANE=ROAD/4,CAR_OFF=-LANE/2,DIR=1;

// modo leve em celulares e telas pequenas: menos vegetação, sombras e resolução menores
const LITE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700;const QV=LITE?0.4:0.7;
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,LITE?1:1.5));renderer.setSize(host.clientWidth,host.clientHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.98;
host.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();const st=document.getElementById('status');st.hidden=false;st.textContent='O navegador interrompeu o 3D por falta de memória de vídeo. Recarregue a página.';});
const scene=new THREE.Scene();const MIST=0x8d9a86;scene.fog=new THREE.Fog(MIST,260,1350);
const camera=new THREE.PerspectiveCamera(42,host.clientWidth/host.clientHeight,0.3,5000);
const HOME={pos:new THREE.Vector3(-420,330,560),tgt:new THREE.Vector3(0,0,0)};camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.copy(HOME.tgt);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.48;controls.minDistance=5;controls.maxDistance=1400;controls.autoRotateSpeed=.5;

scene.add(new THREE.HemisphereLight(0xe6efe8,0x2e3a1e,0.62));
const sun=new THREE.DirectionalLight(0xfff0d2,1.15);sun.position.set(-320,400,-260);sun.castShadow=true;sun.shadow.mapSize.set(LITE?2048:3072,LITE?2048:3072);
Object.assign(sun.shadow.camera,{left:-560,right:560,top:460,bottom:-460,near:50,far:1600});sun.shadow.bias=-0.0004;scene.add(sun);
// céu nublado com brilho difuso do sol
(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{s:{value:sun.position.clone().normalize()}},
 vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform vec3 s;varying vec3 d;void main(){vec3 hz=vec3(.55,.6,.53),mid=vec3(.6,.68,.7),top=vec3(.42,.53,.62);
  float y=d.y;vec3 c=mix(hz,mid,smoothstep(-.02,.25,y));c=mix(c,top,smoothstep(.25,.95,y));float k=max(dot(normalize(d),normalize(s)),0.);
  c+=vec3(1.,.93,.78)*(pow(k,6.)*.2+pow(k,60.)*.35);gl_FragColor=linearToOutputTexel(vec4(pow(c,vec3(2.2)),1.));}`});
 const s=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),m);s.renderOrder=-1;s.onBeforeRender=()=>s.position.copy(camera.position);scene.add(s);})();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9},o));
const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};
const status=document.getElementById('status');

// relevo natural: baixadas alagadas, canais sinuosos, montinhos e morros de mata nas bordas
function natural(x,z){const u=x/MW+.5,v=z/MH+.5;
  let h=2.1*Math.sin(x*.016+1.3)*Math.cos(z*.019-.4)+1.5*Math.sin(x*.037-z*.029+2.1)+0.8*Math.sin(x*.083+.5)*Math.sin(z*.077+1.1)+0.9;
  const ch=Math.sin(x*.011+Math.sin(z*.018)*1.7)+0.45*Math.cos(z*.014+.7);h-=3.4*Math.exp(-ch*ch*14); // canais
  const ch2=Math.sin(z*.013+Math.sin(x*.017+1.2)*1.4+2.2);h-=2.6*Math.exp(-ch2*ch2*22);
  const e=Math.min(u,1-u,v,1-v);h+=45*(1-ss(0,.15,e))+35*ss(0,.4,-e);
  return h;}

// linha central da pista
const curve=new THREE.CatmullRomCurve3(CTRL.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'centripetal');
const N=1800;const C=curve.getSpacedPoints(N).slice(0,N);const trackLen=curve.getLength();
const tan=C.map((p,i)=>{const a=C[(i-1+N)%N],b=C[(i+1)%N];return new THREE.Vector2(b.x-a.x,b.z-a.z).normalize();});
// a pista corre sobre um aterro, sempre acima da água
let el=C.map(p=>Math.max(natural(p.x,p.z),0.4)+1.7);for(let it=0;it<70;it++){el=el.map((v,i)=>(el[(i-1+N)%N]+2*v+el[(i+1)%N])/4);}

// largada no lado oeste
let si=0;{let b=1e9;C.forEach((p,i)=>{const d=Math.hypot(p.x+356,p.z-0);if(d<b){b=d;si=i;}});}
const idist=(a,b)=>Math.min((a-b+N)%N,(b-a+N)%N);

// ---- duas quedas: trechos retos longe da largada e um do outro ----
const cv=C.map((p,i)=>{const a=tan[(i-6+N)%N],b=tan[(i+6)%N];return Math.abs(a.x*b.y-a.y*b.x);});
const JUMPS=[];
function pickJump(kind){const GAP=26,LR=30,span=GAP+2*LR+26;let best=1e9,bg=-1;
  for(let s=0;s<N;s+=3){let m=0;for(let j=0;j<span;j++)m=Math.max(m,cv[(s+j)%N]);const mid=(s+span/2)%N;
    if(idist(mid,si)<240)continue;if(JUMPS.some(J=>idist(mid,(J.g0+GAP/2)%N)<N/3))continue;if(m<best){best=m;bg=(s+LR+13)%N;}}
  if(bg>=0)JUMPS.push({g0:bg,GAP,LR,HT:7,HL:2.4,APEX:9,kind});}
pickJump(0);pickJump(1);
JUMPS.forEach(J=>{J.g1=(J.g0+J.GAP)%N;J.gc=(J.g0+J.GAP/2)%N;});
const relJ=(J,k)=>((k-J.g0)%N+N)%N;
const gapQ=k=>JUMPS.some(J=>relJ(J,k)<J.GAP);
const inJump=(k,m=0)=>JUMPS.some(J=>((k-(J.g0-J.LR-m))%N+N)%N<J.GAP+2*J.LR+2*m);
// o carro anda no sentido dos índices crescentes: sobe a rampa até g0, voa até g1 e desce depois
function lift(k){let h=0;for(const J of JUMPS){const r=relJ(J,k);
  if(r<=J.GAP){h+=J.HT+(J.HL-J.HT)*r/J.GAP;continue;}
  const a=(J.g0-k+N)%N;if(a<=J.LR){h+=J.HT*(1-a/J.LR)**2;continue;}
  const b=r-J.GAP;if(b<=J.LR)h+=J.HL*(1-b/J.LR)**2;}return h;}
function jumpExtra(ff){for(const J of JUMPS){const r=((ff-J.g0)%N+N)%N;if(r<J.GAP){const t=r/J.GAP;return 4*J.APEX*t*(1-t);}}return 0;}
function xs(k,off,y,out){const p=C[k],t=tan[k];return (out||new THREE.Vector3()).set(p.x-t.y*off,el[k]+y+lift(k),p.z+t.x*off);}

// busca rápida do ponto da pista mais próximo
const G=20,grid=new Map();C.forEach((p,i)=>{const k=Math.floor(p.x/G)+','+Math.floor(p.z/G);(grid.get(k)||grid.set(k,[]).get(k)).push(i);});
function nearest(x,z){const gx=Math.floor(x/G),gz=Math.floor(z/G);let best=1e9,bi=-1;
  for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const l=grid.get((gx+a)+','+(gz+b));if(!l)continue;for(const i of l){const d=(C[i].x-x)**2+(C[i].z-z)**2;if(d<best){best=d;bi=i;}}}
  return bi<0?null:{d:Math.sqrt(best),i:bi};}
function ground(x,z){let h=natural(x,z);const n=nearest(x,z);
  if(n){const edge=H+KERB+1.5,w=ss(edge,edge+22,n.d);const road=el[n.i]-0.3;h=n.d<edge?road:road*(1-w)+h*w;
    for(const J of JUMPS){const di=idist(n.i,J.gc);const dep=(1-ss(0,1,(di-J.GAP/2-1)/12))*(1-ss(0,1,(n.d-28)/34));if(dep>0)h=h*(1-dep)+(el[n.i]-11)*dep;}}
  return h;}

function build(){
  // ---- terreno com cores por altura: lama, musgo, capim e mata ----
  const tg=new THREE.PlaneGeometry(MW*1.8,MH*1.8,440,350);tg.rotateX(-Math.PI/2);const P=tg.attributes.position;const col=new Float32Array(P.count*3);
  const cMudW=new THREE.Color(0x26281a),cMud=new THREE.Color(0x463b24),cMoss=new THREE.Color(0x34501d),cGrass=new THREE.Color(0x4f7226),cForest=new THREE.Color(0x2a4320),cBank=new THREE.Color(0x58503c),c=new THREE.Color();
  for(let i=0;i<P.count;i++){const x=P.getX(i),z=P.getZ(i),h=ground(x,z);P.setY(i,h);const n=nearest(x,z);
    const nz=0.5+0.5*Math.sin(x*.21+Math.sin(z*.13)*2)*Math.cos(z*.17-x*.05);
    if(h<-0.2)c.copy(cMudW);else if(h<0.7)c.copy(cMud).lerp(cMoss,ss(0,.7,h));else if(h<10)c.copy(cMoss).lerp(cGrass,ss(.7,3.5,h)*nz);else c.copy(cGrass).lerp(cForest,ss(10,22,h));
    if(n&&n.d<H+KERB+6)c.lerp(cBank,0.7);c.offsetHSL(0,0,(nz-.5)*.06);col.set([c.r,c.g,c.b],i*3);}
  tg.setAttribute('color',new THREE.BufferAttribute(col,3));tg.computeVertexNormals();
  const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);

  // ---- água turva com ondulação, lentilha-d'água e reflexo do céu ----
  const wu={uT:{value:0},uSun:{value:sun.position.clone().normalize()},uFog:{value:new THREE.Color(MIST).convertSRGBToLinear()}};
  const water=new THREE.Mesh(new THREE.PlaneGeometry(MW*1.8,MH*1.8).rotateX(-Math.PI/2),new THREE.ShaderMaterial({uniforms:wu,transparent:true,depthWrite:false,
    vertexShader:`varying vec3 w;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;gl_Position=projectionMatrix*viewMatrix*p;}`,
    fragmentShader:`uniform float uT;uniform vec3 uSun,uFog;varying vec3 w;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.07+vec2(3.1,1.7);a*=.5;}return v;}
      void main(){vec2 p=w.xz;float e=.15;float a=fb(p*.35+uT*.05),bx=fb((p+vec2(e,0))*.35+uT*.05),bz=fb((p+vec2(0,e))*.35+uT*.05);
        vec3 nm=normalize(vec3((a-bx)*1.6,1.,(a-bz)*1.6));vec3 v=normalize(cameraPosition-w);
        float fr=.04+.96*pow(1.-max(dot(nm,v),0.),5.);vec3 col=mix(vec3(.05,.08,.045),vec3(.38,.45,.42),clamp(fr,0.,1.)*.8);
        float duck=smoothstep(.56,.7,fb(p*.06+vec2(4.,9.)))*0.85;col=mix(col,vec3(.17,.27,.06),duck);
        vec3 r=reflect(-uSun,nm);col+=vec3(1.,.95,.8)*pow(max(dot(r,v),0.),90.)*(1.-duck)*.8;
        float d=length(cameraPosition-w);col=mix(col,uFog,smoothstep(260.,1350.,d));
        gl_FragColor=linearToOutputTexel(vec4(col,mix(.9,1.,duck)));}`}));
  water.position.y=0;water.renderOrder=1;scene.add(water);

  // ---- faixas ao longo da pista ----
  function strip(offA,offB,yA,yB,vScale,material){const pos=[],uv=[],idx=[];let dist=0;const va=new THREE.Vector3(),vb=new THREE.Vector3();
    for(let i=0;i<=N;i++){const k=i%N;if(i>0)dist+=C[k].distanceTo(C[(k-1+N)%N]);
      xs(k,offA,yA,va);xs(k,offB,yB,vb);pos.push(va.x,va.y,va.z,vb.x,vb.y,vb.z);uv.push(0,dist/vScale,1,dist/vScale);
      if(i<N&&!gapQ(k)){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);return m;}
  const ac=document.createElement('canvas');ac.width=256;ac.height=512;const a=ac.getContext('2d');
  a.fillStyle='#46484a';a.fillRect(0,0,256,512);for(let i=0;i<9000;i++){const g=58+Math.random()*40|0;a.fillStyle=`rgb(${g},${g+1},${g})`;a.fillRect(Math.random()*256,Math.random()*512,1.5,1.5);}
  for(let i=0;i<40;i++){a.fillStyle='rgba(70,60,40,.18)';a.beginPath();a.ellipse(Math.random()*256,Math.random()*512,10+Math.random()*20,6+Math.random()*14,Math.random()*3,0,7);a.fill();} // manchas de lama
    /* linhas em neon, iguais às da pista urbana */
  const nLines=(g)=>{g.fillStyle='#ff3fa4';g.fillRect(4,0,8,512);g.fillStyle='#2ef2ff';g.fillRect(244,0,8,512);
    for(const [x,c] of [[61,'#b35cff'],[124,'#ffe14d'],[187,'#b35cff']]){g.fillStyle=c;g.fillRect(x,40,8,190);g.fillRect(x,296,8,190);}};
  nLines(a);const ec=document.createElement('canvas');ec.width=256;ec.height=512;const eg=ec.getContext('2d');eg.fillStyle='#000';eg.fillRect(0,0,256,512);nLines(eg);
  const atEm=new THREE.CanvasTexture(ec);atEm.wrapS=atEm.wrapT=THREE.RepeatWrapping;atEm.encoding=THREE.sRGBEncoding;
  const at=new THREE.CanvasTexture(ac);at.wrapS=at.wrapT=THREE.RepeatWrapping;at.encoding=THREE.sRGBEncoding;at.anisotropy=8;
  const kc=document.createElement('canvas');kc.width=16;kc.height=64;const kx=kc.getContext('2d');kx.fillStyle='#2f7a3a';kx.fillRect(0,0,16,32);kx.fillStyle='#f3f1e8';kx.fillRect(0,32,16,32);
  const kt=new THREE.CanvasTexture(kc);kt.wrapS=kt.wrapT=THREE.RepeatWrapping;kt.encoding=THREE.sRGBEncoding;
  strip(-H-KERB-2.2,-H-KERB,-1.2,0.02,10,mat(0x5c5038,{side:THREE.DoubleSide}));
  strip(H+KERB,H+KERB+2.2,0.02,-1.2,10,mat(0x5c5038,{side:THREE.DoubleSide}));
  strip(-H-KERB,-H,0.06,0.1,3,new THREE.MeshStandardMaterial({map:kt,roughness:.6,side:THREE.DoubleSide}));
  strip(H,H+KERB,0.1,0.06,3,new THREE.MeshStandardMaterial({map:kt,roughness:.6,side:THREE.DoubleSide}));
  strip(-H,H,0.1,0.1,ROAD,new THREE.MeshStandardMaterial({map:at,emissiveMap:atEm,emissive:0xffffff,emissiveIntensity:1.2,roughness:.8,side:THREE.DoubleSide}));
  /* pulsos de energia correndo pelas linhas */
  const pulseU={uT:{value:0}};
  strip(-H,H,0.13,0.13,ROAD,new THREE.ShaderMaterial({uniforms:pulseU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    vertexShader:`varying vec2 vu;void main(){vu=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uT;varying vec2 vu;void main(){float v=vu.y*ROADK;float p=fract(v*.04-uT*.55*DIRK);float band=smoothstep(.0,.06,p)*(1.-smoothstep(.06,.22,p));
      float lane=0.;for(int k=1;k<4;k++){lane=max(lane,1.-smoothstep(.0,.035,abs(vu.x-float(k)*.25)));}lane=max(lane,1.-smoothstep(.0,.05,min(vu.x,1.-vu.x)));

        fw.set(nx*dS+tn.x*dA,f.state==='startle'?.5:0,nz*dS+tn.y*dA);b.g.lookAt(tmp.copy(P0).add(fw));
        const fl=f.state==='startle'?b.fl*1.8:b.fl,an=Math.sin(tt*fl+b.ph)*(f.state==='idle'?.45:.75);b.wings[0].rotation.z=an;b.wings[1].rotation.z=-an;}}
    birdsUpdate=(dt,now,ci,spd)=>{for(const f of flocks){const d=(f.i-ci+N)%N;
      if(d>N/2)f.armed=true;
      /* o carro se aproxima: o bando mergulha para cruzar a pista bem na frente dele */
      if(f.state==='idle'&&f.armed&&d<62&&d>30&&car.visible){f.armed=false;if(r()<.85){f.state='cross';f.s=f.side*FAR;f.y=8;const T=d*(trackLen/N)/Math.max(spd,12);f.v=Math.min(30,Math.max(9,Math.abs(f.side*FAR-CAR_OFF)/T));}}
      place(f,dt,now,ci,spd);}};
    birdHit=(ci,now)=>{for(const f of flocks){if(f.state!=='cross'||f.hit)continue;if(idist(ci,f.i)<=6&&Math.abs(f.s-CAR_OFF)<7){f.hit=true;f.state='startle';
        for(const b of f.birds){b.vy=6+Math.random()*5;}
        skid.t=0;skid.sign=Math.random()<.5?-1:1;skid.amp=Math.min(.6,.25+speed*.006);skid.lat=Math.min(2,.7+speed*.026);
        const o=car.position.clone();o.y+=2.5;for(let k=0;k<40;k++){spark(o,new THREE.Vector3((Math.random()-.5)*8,1+Math.random()*5,(Math.random()-.5)*8));spV[(spH-1+SPK)%SPK].c=[.95,.95,.9];}
        return;}}};
  }
  onFrame=(now)=>{const dt=Math.min(.05,clock.getDelta());
    if(!reduce){mixers.forEach(m=>m.update(dt));pulseU.uT.value=now*0.001;birdsUpdate(dt,now,Math.floor(carT*N)%N,speed);updatePads(dt,now);if(mudUpdate)mudUpdate(dt,now);if(fireflies)fireflies(now);wu.uT.value=now*0.001;}
    if(car.visible&&!reduce){const i=Math.floor(carT*N)%N,j=(i+12)%N;const turn=Math.abs(tan[i].x*tan[j].y-tan[i].y*tan[j].x);const slope=(el[(i+4)%N]-el[i])/4;
      let target=Math.max(14,46-turn*160-slope*40);if(inJump(i,20))target=Math.max(target,46);speed+=(target-speed)*Math.min(1,dt*(speed>target+8?0.6:1.5));
      // entrou numa poça na mesma faixa: derrapagem (rabo balançando, desvio lateral e perda de velocidade)
      for(const pu of puddles){const half=Math.round(pu.L/2/(trackLen/N));if(idist(i,pu.i)<=half&&Math.abs(pu.lat-CAR_OFF)<pu.Wd/2+0.9&&pu.hit!==Math.floor(now/3000)){pu.hit=Math.floor(now/3000);
        skid.t=0;skid.sign=Math.random()<.5?-1:1;skid.amp=Math.min(.55,.22+speed*.006);skid.lat=Math.min(1.8,.6+speed*.025);}}
      birdHit(i,now);
      if(skid.t<2.2){skid.t+=dt;if(skid.t<0.9)speed*=1-dt*0.7;}
      for(const pd of pads){if(idist(i,pd.i)<3&&Math.abs(pd.lane-CAR_OFF)<0.1&&pd.hit!==Math.floor(now/2000)){pd.hit=Math.floor(now/2000);speed=Math.max(speed,72);boostFx();}}
      carT=(carT+speed*dt/trackLen)%1;}
    const f=carT*N;xsF(f,CAR_OFF,0.1,cP);xsF(f+2.6,CAR_OFF,0.1,cQ);cP.y+=jumpExtra(f);cQ.y+=jumpExtra(f+2.6);
    // deslocamento e giro da derrapagem
    let yawSk=0;if(skid.t<2.2){const k=skid.t,dec=Math.exp(-k*1.7);yawSk=skid.sign*skid.amp*Math.sin(k*8.5)*dec;const lo=skid.sign*skid.lat*Math.sin(k*4.2)*Math.exp(-k*1.3);
      const ii=Math.floor(f)%N,t2=tan[ii];cP.x+=-t2.y*lo;cP.z+=t2.x*lo;cQ.x+=-t2.y*lo;cQ.z+=t2.x*lo;}
    car.position.copy(cP);car.lookAt(cQ);if(yawSk)car.rotateY(yawSk);if(!reduce)updateSparks(dt);
    if(skid.t<1.1&&!reduce){const dir=new THREE.Vector3(0,0,1).applyQuaternion(car.quaternion),side=new THREE.Vector3(1,0,0).applyQuaternion(car.quaternion);
      for(const sg of [-1,1]){const w=car.position.clone().addScaledVector(dir,-1.4).addScaledVector(side,sg*1);emitMud(w,dir,side,skid.t<0.5?4:2);}}
    if(!reduce){updateMud(dt);puddles.mu.uT.value=now*0.001;}wheels.forEach(w=>w.rotation.x+=speed*dt/0.42);
    $('sSpd').textContent=Math.round(speed*3.6)+' km/h';
    if(chase){camLock=true;const fc=f-10;xsF(fc,CAR_OFF,5.5,cC);cC.y+=jumpExtra(fc)*0.8;camera.position.lerp(cC,.2);
      controls.target.copy(cQ).add(new THREE.Vector3(0,1.2,0));camera.lookAt(controls.target);}
    else camLock=false;
  };
}
let birdsUpdate=()=>{},birdHit=()=>{};let onFrame=null,camLock=false,anim=null;function fly(pos,tgt){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.getElementById('tgl').onclick=e=>{const m=document.getElementById('panel').classList.toggle('min');e.currentTarget.textContent=m?'Mostrar':'Ocultar';e.currentTarget.setAttribute('aria-expanded',!m);};
if(window.innerWidth<520){document.getElementById('panel').classList.add('min');document.getElementById('tgl').textContent='Mostrar';}
window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);});
const comp=document.getElementById('comp');
function loop(now){requestAnimationFrame(loop);
  if(anim){let k=Math.min(1,(now-anim.s)/1400);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(k>=1)anim=null;}
  if(onFrame)onFrame(now);if(!camLock)controls.update();comp.style.transform=`rotate(${controls.getAzimuthalAngle()*180/Math.PI}deg)`;renderer.render(scene,camera);}
setTimeout(()=>{try{build();}catch(e){status.textContent='Não foi possível montar a cena.';console.error(e);}},30);
requestAnimationFrame(loop);
})();
</script>
