<title>Pista do Deserto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cena 3D em tela cheia, painel flutuante no canto, bússola; paleta de areia e asfalto */
:root{
  --panel:#fbf7f0; --ink:#2e2418; --muted:#76664f; --line:#e3d6c2; --accent:#b4532a; --accent-ink:#ffffff; --sky:#e9d3b2;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#231c14; --ink:#f1e7d8; --muted:#b9a88f; --line:#43372a; --accent:#e58a5b; --accent-ink:#1e130c; --sky:#2a2118; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#231c14; --ink:#f1e7d8; --muted:#b9a88f; --line:#43372a; --accent:#e58a5b; --accent-ink:#1e130c; --sky:#2a2118; color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  width:min(270px, calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;box-shadow:0 10px 30px rgba(60,40,20,.2);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-right:64px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:2px 0 0;color:var(--accent)}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--ink);font-size:16px;font-family:var(--display)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 12.5px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.toggle{position:absolute;top:12px;right:12px;padding:3px 9px;font-size:11px}
.panel.min .stats,.panel.min .btns,.panel.min .hint{display:none}
.compass{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(60,40,20,.2);display:grid;place-items:center}
.compass svg{width:52px;height:52px}
</style>

<div id="scene"></div>
<aside class="panel" id="panel">
  <button class="toggle" id="tgl" aria-expanded="true">Ocultar</button>
  <div><div class="eyebrow">Circuito no deserto</div><h1>Pista do Deserto</h1></div>
  <div class="stats"><div>Extensão<b id="sLen">–</b></div><div>Desnível<b id="sDrop">–</b></div><div>Velocidade<b id="sSpd">–</b></div></div>
  <div class="btns">
    <button id="bCar" aria-pressed="true">Carro</button>
    <button id="bChase" aria-pressed="false">Câmera do carro</button>
    <button id="bRot" aria-pressed="false">Girar</button>
    <button id="b360">Ver 360°</button>
    <button id="bJump">Ver salto</button>
    <button id="bTop">Vista de cima</button>
    <button id="bReset">Recentrar</button>
  </div>
  <div class="hint" id="status">Modelando o terreno…</div>
  <div class="hint">Arraste para girar, role ou pince para aproximar, botão direito ou dois dedos para mover.</div>
</aside>
<div class="compass" aria-label="Norte"><svg id="comp" viewBox="-30 -30 60 60"><polygon points="0,-24 6,0 -6,0" fill="#b5432f"/><polygon points="0,24 6,0 -6,0" fill="#8a8f86"/><text x="0" y="-12" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700" dy="3">N</text></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
// planta: imagem de 2000×1491 px; 1 unidade = 1 m = 2 px  → mapa de 1000 × 745 m
const IW=2000,IH=1491,PX=2,MW=IW/PX,MH=IH/PX;
const CENTRO=[[781.1,332.9],[764.6,336.1],[748.1,341.6],[731.6,349.5],[714.9,359.8],[699.3,372.1],[685.7,386.0],[674.4,401.5],[666.0,418.1],[660.8,435.1],[659.1,452.1],[660.8,469.3],[665.2,486.8],[672.4,504.7],[681.8,522.9],[692.3,541.9],[702.3,561.8],[710.4,582.1],[713.9,603.2],[712.6,623.1],[706.1,640.9],[694.1,655.8],[678.1,666.8],[659.1,673.5],[637.9,675.6],[616.8,672.4],[596.4,665.6],[576.4,656.1],[557.0,644.7],[537.7,632.4],[518.7,619.9],[500.1,608.2],[481.9,598.1],[463.9,589.9],[445.8,583.7],[428.0,579.7],[410.4,577.8],[392.9,578.1],[375.1,580.4],[357.4,584.9],[339.4,591.5],[321.7,600.3],[304.3,611.1],[287.4,624.1],[271.7,638.6],[257.6,654.4],[245.4,671.1],[235.3,688.2],[227.4,705.9],[221.7,723.7],[218.6,741.1],[218.0,758.5],[220.4,775.6],[225.8,791.9],[234.1,806.9],[244.9,819.6],[258.1,829.9],[273.6,837.9],[290.2,843.3],[307.4,845.8],[325.0,845.8],[342.8,843.6],[361.1,839.6],[379.3,834.3],[397.6,827.5],[416.1,819.6],[435.1,811.1],[454.4,802.6],[474.1,795.1],[494.3,789.2],[515.1,786.5],[534.6,788.8],[551.6,795.9],[564.5,807.4],[572.6,822.3],[575.7,840.2],[573.9,860.6],[566.9,881.8],[556.9,902.1],[545.3,921.5],[533.7,940.3],[523.5,958.4],[515.2,976.5],[509.1,994.0],[505.8,1011.1],[506.0,1027.6],[510.0,1043.1],[517.7,1056.8],[528.4,1069.3],[541.6,1079.6],[556.9,1088.2],[574.1,1094.8],[591.9,1099.2],[610.1,1102.2],[628.3,1104.0],[646.4,1104.4],[664.3,1103.1],[682.3,1099.9],[699.9,1094.1],[716.4,1086.0],[731.4,1075.5],[744.7,1062.6],[755.9,1048.1],[764.9,1031.9],[771.5,1014.7],[775.9,996.9],[778.7,978.4],[780.9,959.4],[783.6,940.1],[788.0,920.1],[795.4,899.9],[805.6,881.2],[818.9,864.7],[834.7,851.3],[853.1,840.7],[872.8,833.3],[893.0,829.2],[912.8,828.0],[932.3,828.2],[951.4,828.9],[970.0,829.4],[988.3,829.3],[1007.0,828.4],[1025.7,826.9],[1044.2,824.6],[1062.4,821.3],[1080.4,816.7],[1097.9,810.1],[1113.7,801.9],[1127.0,791.9],[1137.5,779.9],[1145.0,765.9],[1149.4,750.4],[1150.4,733.7],[1147.7,716.9],[1141.8,700.1],[1133.1,683.9],[1122.1,669.1],[1109.1,656.3],[1094.2,645.3],[1077.8,636.7],[1060.6,630.6],[1042.9,626.8],[1024.9,624.9],[1006.1,624.3],[987.0,624.0],[966.7,621.7],[947.9,616.4],[931.4,607.9],[917.8,596.1],[907.6,581.1],[901.7,563.5],[898.9,543.9],[900.1,523.8],[902.4,504.4],[904.9,485.4],[906.7,467.3],[907.0,449.6],[905.4,431.9],[901.4,414.1],[894.6,396.9],[885.4,380.9],[874.1,366.9],[860.4,354.7],[845.1,345.1],[829.6,337.9],[813.4,333.4],[797.3,332.1]]; // linha central da pista extraída da imagem (px)
const toW=(px,py)=>new THREE.Vector2((px-IW/2)/PX,(py-IH/2)/PX);
const ROAD=17,KERB=1.1,WALL_H=1.1,WALL_W=0.6; // pista duplicada (4 faixas), zebras e mureta // largura do asfalto e das zebras (m)

const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();const HAZE=0xe7cfa8;scene.fog=new THREE.Fog(HAZE,560,1350);
const camera=new THREE.PerspectiveCamera(42,host.clientWidth/host.clientHeight,0.3,4000);
const HOME={pos:new THREE.Vector3(-315,340,495),tgt:new THREE.Vector3(-90,0,0)};camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.copy(HOME.tgt);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.48;controls.minDistance=5;controls.maxDistance=1300;controls.autoRotateSpeed=.5;

scene.add(new THREE.HemisphereLight(0xfff1dc,0x8a6a45,0.7));
const sun=new THREE.DirectionalLight(0xffe2b8,1.35);sun.position.set(-390,330,-300);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-480,right:480,top:390,bottom:-390,near:50,far:1500});sun.shadow.bias=-0.0004;scene.add(sun);
// céu quente com sol baixo e névoa de areia
(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{s:{value:sun.position.clone().normalize()}},
 vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform vec3 s;varying vec3 d;void main(){vec3 hz=vec3(.91,.81,.66),mid=vec3(.62,.75,.86),top=vec3(.32,.52,.78);
  float y=d.y;vec3 c=mix(hz,mid,smoothstep(-.02,.25,y));c=mix(c,top,smoothstep(.2,.9,y));float k=max(dot(normalize(d),normalize(s)),0.);
  c+=vec3(1.,.8,.55)*(pow(k,8.)*.25+pow(k,200.)*1.2);gl_FragColor=vec4(pow(c,vec3(2.2)),1.);gl_FragColor=linearToOutputTexel(gl_FragColor);}`});
 const s=new THREE.Mesh(new THREE.SphereGeometry(2500,32,16),m);s.renderOrder=-1;s.onBeforeRender=()=>s.position.copy(camera.position);scene.add(s);})();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9},o));
const status=document.getElementById('status');

// linha central suavizada da pista
const curve=new THREE.CatmullRomCurve3(CENTRO.map(p=>{const v=toW(p[0],p[1]);return new THREE.Vector3(v.x,0,v.y);}),true,'centripetal');
const N=1300;const C=curve.getSpacedPoints(N).slice(0,N);
const trackLen=curve.getLength();

const img=new Image();img.src='deserto.jpg';
img.onload=()=>{try{build();}catch(e){status.textContent='Não foi possível montar a cena.';console.error(e);}};
img.onerror=()=>{status.textContent='Não foi possível carregar a textura do deserto.';};

function build(){
  // amostra a imagem em baixa resolução: tons escuros viram morros, claros viram o vale de areia
  const SW=200,SH=150,cv=document.createElement('canvas');cv.width=SW;cv.height=SH;const cx=cv.getContext('2d');
  cx.filter='blur(3px)';cx.drawImage(img,0,0,SW,SH);const data=cx.getImageData(0,0,SW,SH).data;
  const lum=(u,v)=>{u=Math.min(SW-1.001,Math.max(0,u*SW-.5));v=Math.min(SH-1.001,Math.max(0,v*SH-.5));const x0=u|0,y0=v|0,fx=u-x0,fy=v-y0;
    const L=(x,y)=>{const i=(y*SW+x)*4;return (0.3*data[i]+0.59*data[i+1]+0.11*data[i+2])/255;};
    return L(x0,y0)*(1-fx)*(1-fy)+L(x0+1,y0)*fx*(1-fy)+L(x0,y0+1)*(1-fx)*fy+L(x0+1,y0+1)*fx*fy;};
  const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};
  function naturalBase(x,z){const u=x/MW+.5,v=z/MH+.5;
    const l=lum(u,v);let h=(0.66-l)*120;                                   // relevo vindo das pinceladas da imagem
    const e=Math.min(u,1-u,v,1-v);h+=100*(1-ss(0,.18,e))+65*ss(0,.35,-e);                    // serras nas bordas do mapa
    h+=6.5*Math.sin(x*.03+z*.02)*Math.sin(z*.033-x*.008);                   // ondulações de dunas
    h+=1.6*Math.abs(Math.sin(x*.11+z*.07+Math.sin(z*.03)*2));               // cristas de areia
    return Math.max(h,-6);}
  // maciço rochoso que cobre a curva do túnel: forma irregular, com cristas e picos
  const MX=-300,MZ=-22;
  function mountain(x,z){const dx=x-MX,dz=z-MZ;const r=Math.sqrt((dx/150)**2+(dz/115)**2);if(r>1.6)return 0;
    const base=Math.exp(-r*r*2.2);
    const ridge=1-Math.abs(Math.sin(x*.035+Math.sin(z*.028)*1.8))*0.55-Math.abs(Math.sin(z*.05-x*.012))*0.25;
    const peaks=18*Math.exp(-((dx+25)**2+(dz+12)**2)/1800)+12*Math.exp(-((dx-30)**2+(dz-28)**2)/1200)+9*Math.exp(-((dx+70)**2+(dz-25)**2)/900);
    return base*(38*ridge+peaks)+3*Math.sin(x*.12)*Math.sin(z*.1)*base;}
  const natural=(x,z)=>naturalBase(x,z)+mountain(x,z);
  // altura da pista: o terreno ao longo dela, bem suavizado
  let el=C.map(p=>naturalBase(p.x,p.z));for(let it=0;it<60;it++){el=el.map((v,i)=>(el[(i-1+N)%N]+2*v+el[(i+1)%N])/4);}
  const minE=Math.min(...el),maxE=Math.max(...el);
  const tan=C.map((p,i)=>{const a=C[(i-1+N)%N],b=C[(i+1)%N];return new THREE.Vector2(b.x-a.x,b.z-a.z).normalize();});
  // túnel: cobre a curva do lóbulo oeste (o "C" aberto para a direita na planta)
  const inLobe=C.map(p=>{const px=p.x*PX+IW/2,py=p.z*PX+IH/2;return px<470&&py>560&&py<850;});
  let tA=-1,tLen=0;{let best=0,bs=-1;for(let s=0;s<N;s++){if(!inLobe[s]||inLobe[(s-1+N)%N])continue;let l=0;while(l<N&&inLobe[(s+l)%N])l++;if(l>best){best=l;bs=s;}}tA=(bs+6)%N;tLen=Math.max(0,best-12);}
  const inTunnel=(i,m=0)=>tA>=0&&((i-tA+m+N)%N)<tLen+2*m;
  // tubo do túnel e saca-rolhas: no meio do túnel a pista gira 360° em torno de um eixo acima dela
  const TR=14,TAX=9.4,WMAX=10.25; // raio do tubo, altura do eixo sobre a pista, meia-largura máxima dentro do tubo
  const R0=0.22,R1=0.82;          // trecho do túnel (fração) onde acontece o giro
  const phi=new Float32Array(N);
  if(tLen>60){const rs=Math.round(tLen*R0),re=Math.round(tLen*R1);for(let k=rs;k<=re;k++){const u=(k-rs)/(re-rs);phi[(tA+k)%N]=2*Math.PI*(u-0.75*Math.sin(2*Math.PI*u)/(2*Math.PI)); /* giro suave, mais rápido no meio */}}
  // posição no mundo de um ponto da seção da pista (deslocamento lateral, altura), já com o giro aplicado
  function xs(k,off,y,out){const p=C[k],t=tan[k],nx=-t.y,nz=t.x;
    if(inTunnel(k,1)){off=Math.max(-WMAX,Math.min(WMAX,off));y=Math.max(y,0);}
    y+=lift(k);
    const ph=phi[k];if(ph){const c=Math.cos(ph),s=Math.sin(ph),v=y-TAX;const L=off*c-v*s;y=off*s+v*c+TAX;off=L;}
    return (out||new THREE.Vector3()).set(p.x+nx*off,el[k]+y,p.z+nz*off);}
  // ---- salto: a pista é cortada sobre um cânion; rampa de saída, vão e rampa de chegada ----
  // (o carro anda no sentido dos índices decrescentes: chega pela rampa em g1+LR..g1, voa até g0 e desce de g0 a g0-LR)
  const GAP=26,LR=30,HT=8,HL=2.6,APEX=10; // vão e rampas em pontos da pista (~1,2 m cada); alturas em m
  let g0=-1;{const cv=C.map((p,i)=>{const a=tan[(i-6+N)%N],b=tan[(i+6)%N];return Math.abs(a.x*b.y-a.y*b.x);});
    let SI0=0,bs=1e9;C.forEach((p,i)=>{const d=Math.abs(p.x+18)+Math.abs(p.z-37)*0.3;if(Math.abs(tan[i].y)<0.2&&d<bs){bs=d;SI0=i;}});
    const span=GAP+2*LR+24;let best=1e9;
    for(let s=0;s<N;s+=3){let m=0,ok=true;for(let j=0;j<span;j++){const k=(s+j)%N;if(inTunnel(k,60)){ok=false;break;}m=Math.max(m,cv[k]);}
      const mid=(s+span/2)%N,dS=Math.min((mid-SI0+N)%N,(SI0-mid+N)%N);if(!ok||dS<160)continue;if(m<best){best=m;g0=(s+LR+12)%N;}}}
  const g1=(g0+GAP)%N,rel=k=>((k-g0)%N+N)%N;
  const gapQ=k=>g0>=0&&rel(k)<GAP;                                  // trecho sem pista
  const inJump=(k,m=0)=>g0>=0&&((k-(g0-LR-m))%N+N)%N<GAP+2*LR+2*m;  // rampas + vão (+ margem)
  function lift(k){if(g0<0)return 0;const r=rel(k);if(r<=GAP)return HL+(HT-HL)*r/GAP;
    const a=r-GAP;if(a<=LR)return HT*(1-a/LR)**2;                    // rampa de saída: mais inclinada na borda
    const b=(g0-k+N)%N;if(b<=LR)return HL*(1-b/LR)**2;               // rampa de chegada
    return 0;}
  function jumpExtra(ff){if(g0<0)return 0;const r=((ff-g0)%N+N)%N;if(r>=GAP)return 0;const t=1-r/GAP;return 4*APEX*t*(1-t);} // arco do voo
  // grade de busca rápida do ponto da pista mais próximo
  const G=20,grid=new Map();C.forEach((p,i)=>{const k=Math.floor(p.x/G)+','+Math.floor(p.z/G);(grid.get(k)||grid.set(k,[]).get(k)).push(i);});
  function nearest(x,z){const gx=Math.floor(x/G),gz=Math.floor(z/G);let best=1e9,bi=-1;
    for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const l=grid.get((gx+a)+','+(gz+b));if(!l)continue;for(const i of l){const d=(C[i].x-x)**2+(C[i].z-z)**2;if(d<best){best=d;bi=i;}}}
    return bi<0?null:{d:Math.sqrt(best),i:bi};}
  function ground(x,z){let h=natural(x,z);const n=nearest(x,z);
    if(n){const tun=inTunnel(n.i,-3);const edge=tun?TR+1.5:ROAD/2+KERB+1,w=ss(edge,edge+26,n.d);const road=el[n.i]-(tun?7:0.25);h=n.d<edge?road:road*(1-w)+h*w;}
    if(n&&g0>=0){const gc=(g0+GAP/2)%N,di=Math.min((n.i-gc+N)%N,(gc-n.i+N)%N);const sm=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v);};
      const dep=(1-sm((di-GAP/2-1)/12))*(1-sm((n.d-28)/34));if(dep>0)h=h*(1-dep)+(el[n.i]-20)*dep;} // cânion
    return h;}

  // terreno com a imagem (sem a pista pintada) como textura
  const tex=new THREE.Texture(img);tex.encoding=THREE.sRGBEncoding;tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;tex.anisotropy=8;tex.needsUpdate=true;
  const tg=new THREE.PlaneGeometry(MW*1.9,MH*1.9,560,420);tg.rotateX(-Math.PI/2);const P=tg.attributes.position,UV=tg.attributes.uv;
  for(let i=0;i<P.count;i++){const x=P.getX(i),z=P.getZ(i);P.setY(i,ground(x,z));UV.setXY(i,x/MW+.5,1-(z/MH+.5));} // terreno vai além da imagem, virando serra
  tg.computeVertexNormals();
  const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({map:tex,roughness:1}));terrain.receiveShadow=true;terrain.castShadow=true;scene.add(terrain);

    const P0=new THREE.Vector3(),tmp=new THREE.Vector3(),fw=new THREE.Vector3();
    function place(f,dt,now,ci,spd){const tt=now*0.001,c=C[f.i],tn=tan[f.i],nx=-tn.y,nz=tn.x,base=el[f.i];
      if(f.state==='idle'){f.t+=dt;}
      else{if(f.state==='cross'&&!f.hit){const rem=f.side*(f.s-LN),d=((ci-f.i)%N+N+N/2)%N-N/2;if(rem>0&&d>0){const T=d*ds_/Math.max(spd,10);f.v=Math.min(34,Math.max(6,rem/T));}}
        f.s+=-f.side*f.v*dt;const u=Math.min(1,Math.abs(f.s)/FAR);
        if(f.state==='cross')f.y=2.6+11*u*u;else f.y+=dt*8;
        if(f.side*f.s<=-FAR){f.side=-f.side;f.state='idle';f.t=0;f.hit=false;}}
      for(const b of f.birds){b.up+=b.vy*dt;b.vy=Math.max(0,b.vy-dt*5);
        let ls,la,y,dS,dA;
        if(f.state==='idle'){/* cada urubu plana no seu próprio círculo, como numa térmica */const a=f.t*.35+b.ring,R=7+b.al*.4;ls=f.side*FAR+R*Math.cos(a);la=R*Math.sin(a);y=13+b.dy*3+Math.abs(b.al)*.6;dS=-Math.sin(a);dA=Math.cos(a);}
        else{dS=-f.side;dA=0;ls=f.s+b.ds*dS-b.al*dA;la=b.ds*dA+b.al*dS;y=f.y+b.dy;}
        P0.set(c.x+nx*ls+tn.x*la,base+y+b.up,c.z+nz*ls+tn.y*la);b.g.position.copy(P0);
        fw.set(nx*dS+tn.x*dA,f.state==='startle'?.5:f.state==='cross'?-.08:0,nz*dS+tn.y*dA);b.g.lookAt(tmp.copy(P0).add(fw));
        if(f.state==='idle')b.g.rotateZ(-0.35);
        /* urubu quase não bate asa: plana; bate forte só ao fugir */
        const an=f.state==='startle'?Math.sin(tt*b.fl*2.2+b.ph)*.8:f.state==='cross'?.12+Math.sin(tt*b.fl+b.ph)*.25:.1+Math.sin(tt*1.2+b.ph)*.05;b.wings[0].rotation.z=an;b.wings[1].rotation.z=-an;}}
    birdsUpdate=(dt,now,ci,spd)=>{for(const f of flocks){const d=((ci-f.i)%N+N)%N; /* o carro anda no sentido dos índices decrescentes */
      if(d>N/2)f.armed=true;
      if(f.state==='idle'&&f.armed&&d<62&&d>30&&car.visible){f.armed=false;if(r()<.85){f.state='cross';f.s=f.side*FAR;f.y=13.6;f.v=12;}}
      place(f,dt,now,ci,spd);}};
    birdHit=(ci,now)=>{for(const f of flocks){if(f.state!=='cross'||f.hit)continue;if(dI(ci,f.i)<=6&&Math.abs(f.s-LN)<7){f.hit=true;f.state='startle';
        for(const b of f.birds){b.vy=6+Math.random()*5;}
        skid.t=0;skid.sign=Math.random()<.5?-1:1;skid.amp=Math.min(.7,.3+speed*.007);skid.lat=Math.min(2.2,.8+speed*.03);
        const o=car.position.clone();o.y+=2.5;for(let k=0;k<36;k++){spark(o,new THREE.Vector3((Math.random()-.5)*8,1+Math.random()*5,(Math.random()-.5)*8));spV[(spH-1+SPK)%SPK].c=[.45,.38,.32];}
        return;}}};
  }
  onFrame=(now)=>{const dt=Math.min(.05,clock.getDelta());if(!reduce){mixers.forEach(m=>m.update(dt));devilUpdate(dt,now);pulseU.uT.value=now*0.001;birdsUpdate(dt,now,Math.floor(carT*N)%N,speed);}
    if(car.visible&&!reduce){
      // velocidade ajustada pela curva e pela inclinação
      const i=Math.floor(carT*N)%N,j=(i+12*DIR+N)%N;const turn=Math.abs(tan[i].x*tan[j].y-tan[i].y*tan[j].x);const slope=(el[(i+4*DIR+N)%N]-el[i])/4;
      let target=Math.max(14,46-turn*160-slope*40);if(phi[i])target=Math.max(target,36);if(inJump(i,20))target=Math.max(target,44); /* embalo no saca-rolhas */
      speed+= (target-speed)*Math.min(1,dt*(speed>target+8?0.6:1.5));
      // passou por cima de uma placa de dash na mesma faixa: impulso
      for(const pd of pads){const di=Math.abs(((i-pd.i)%N+N+N/2)%N-N/2);if(di<3&&Math.abs(pd.lane-CAR_OFF)<0.1&&pd.hit!==Math.floor(now/2000)){pd.hit=Math.floor(now/2000);speed=Math.max(speed,72);boostFx();}}
      for(const d of devils){const di=Math.abs(((i-d.i)%N+N+N/2)%N-N/2);if(di<4&&Math.abs(d.lat-DIR*CAR_OFF)<3.2&&d.hit!==Math.floor(now/3000)){d.hit=Math.floor(now/3000);
        skid.t=0;skid.sign=Math.random()<.5?-1:1;skid.amp=Math.min(.75,.3+speed*.007);skid.lat=Math.min(2.2,.8+speed*.03);}}
      birdHit(i,now);
      if(skid.t<2.4){skid.t+=dt;if(skid.t<0.9)speed*=1-dt*0.8;}
      carT=(carT+DIR*speed*dt/trackLen+1)%1;}
    // posição na faixa do carro, seguindo a seção da pista (inclusive de cabeça para baixo no saca-rolhas)
    const f=carT*N,off=DIR*CAR_OFF;
    xsF(f,off,0.1,cP);xsF(f+DIR*2.6,off,0.1,cQ);xsF(f,off,1.1,cU);cU.sub(cP).normalize();
    cP.y+=jumpExtra(f);cQ.y+=jumpExtra(f+DIR*2.6);
    let yawSk=0;if(skid.t<2.4){const k=skid.t,dec=Math.exp(-k*1.5);yawSk=skid.sign*skid.amp*Math.sin(k*8)*dec;const lo=skid.sign*skid.lat*Math.sin(k*4)*Math.exp(-k*1.2);
      const ii=Math.floor(f)%N,t2=tan[ii];cP.x+=-t2.y*lo;cP.z+=t2.x*lo;cQ.x+=-t2.y*lo;cQ.z+=t2.x*lo;}
    car.position.copy(cP);car.up.copy(cU);car.lookAt(cQ);if(yawSk)car.rotateY(yawSk);if(!reduce)updateSparks(dt);
    if(skid.t<1.2&&!reduce){carAxes();for(const sg of [-1,1]){const w=car.position.clone().addScaledVector(_fw,-1.6).addScaledVector(_sd,sg*.95).addScaledVector(_up,.2);
      for(let k=0;k<2;k++){spark(w,_fw.clone().multiplyScalar(-(3+Math.random()*5)).addScaledVector(_sd,(Math.random()-.5)*5).addScaledVector(_up,1+Math.random()*3));spV[(spH-1+SPK)%SPK].c=[.75,.55,.3];}}}wheels.forEach(w=>w.rotation.x+=speed*dt/0.42);if(!reduce){updatePads(dt,now);if(mudUpdate)mudUpdate(dt,now);}
    document.getElementById('sSpd').textContent=Math.round(speed*3.6)+' km/h';
    if(chase){camLock=true;
      // câmera presa à pista ~12 m atrás do carro, sempre do lado de dentro (gira junto no saca-rolhas)
      const fc=f-DIR*10;xsF(fc,off,5.5,cC);cC.y+=jumpExtra(fc)*0.8;xsF(fc,off,1.1,cN);xsF(fc,off,0.1,cM);cN.sub(cM).normalize();
      camera.position.lerp(cC,.2);camera.up.lerp(cN,.15).normalize();
      controls.target.copy(cQ).addScaledVector(cU,1.2);camera.lookAt(controls.target);}
    else if(camLock){camLock=false;camera.up.set(0,1,0);}
  };
}
let devilUpdate=()=>{},birdsUpdate=()=>{},birdHit=()=>{};let onFrame=null,camLock=false;let anim=null;function fly(pos,tgt){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.getElementById('tgl').onclick=e=>{const m=document.getElementById('panel').classList.toggle('min');e.currentTarget.textContent=m?'Mostrar':'Ocultar';e.currentTarget.setAttribute('aria-expanded',!m);};
if(window.innerWidth<520){document.getElementById('panel').classList.add('min');document.getElementById('tgl').textContent='Mostrar';}
window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);});
const comp=document.getElementById('comp');
function loop(now){requestAnimationFrame(loop);
  if(anim){let k=Math.min(1,(now-anim.s)/1400);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(k>=1)anim=null;}
  if(onFrame)onFrame(now);if(!camLock)controls.update();comp.style.transform=`rotate(${controls.getAzimuthalAngle()*180/Math.PI}deg)`;renderer.render(scene,camera);}
requestAnimationFrame(loop);
})();
</script>
